<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    --fs: 16px;
    --uifont: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg); color: var(--text);
    font-size: var(--fs); line-height: var(--lh, 1.7);

    -webkit-text-size-adjust: 100%;

  body[data-fontfamily="mincho"] { font-family: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "YuMincho", "Yu Mincho", "Noto Serif JP", serif; }

  body[data-fontsize="standard"] { --fs: 16px; }
  body[data-fontsize="large"]  { --fs: 18px; }

  /* v2.40: wood themes — the grain is a fixed layer under the content, tiled at 560px (same treatment as the zukan app) */
  body[data-theme^="wood-"]::before { content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; background-image:var(--desktex); background-size:560px 560px; background-repeat:repeat; }
  body[data-theme^="wood-"] .tdrow { background: transparent; }
  /* v2.41: 木目の上では通常の線色が埋もれるので、仕切りだけ図鑑の強い線色を半分の濃さで使う */
  body[data-theme^="wood-"] .tdrow::after { background: var(--lineStrong); opacity: .5; }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  /* UIの文字は常にゴシック体（本文とカードのタイトル／プレビューだけ選択フォント） */
  #syncbar, .searchbar input, .searchcount, .empty, .taglabel, .tagchip, .tagnote, .tagclear,
  .card .when, .card .tagline, .card .photomark,
  .datepill, .photoline, .editmeta label,
  .sheet h3, .sheet .msg, .sheetbtn, .yearitem,
  .srow, .pillrow, .panelnav, .setlabel, .note, .syncstat, .seg, .btn, .textin,
  .setgroup > h2, .caldayhead, .addphoto {
    font-family: var(--uifont);
  }
  .tagnote { color: var(--muted); font-size: calc(var(--fs) * .85); margin: 0 4px; }
  input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--accent); }

  /* ---------- top bar ---------- */
  .uifont { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 6px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
    background: var(--bg);
  }
  .topbar .ttl { flex: 1; text-align: center; font-size: calc(var(--fs) * 1.12); letter-spacing: .08em; font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .iconbtn { min-width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; font-size: calc(var(--fs) * 1.05); color: var(--text); border-radius: 12px; }
  .iconbtn:active { background: var(--card); }
  .roundbtn {
    width: 46px; height: 46px; flex: none; border-radius: 50%;
    background: var(--card); border: 1px solid var(--line);
    display: inline-flex; align-items: center; justify-content: center; color: var(--text);
  }
  .roundbtn:active { background: var(--card2); }
  .roundbtn svg { width: 23px; height: 23px; }
  .spacer44 { width: 44px; flex: none; }

  #syncbar { text-align: center; font-size: calc(var(--fs) * .72); color: var(--muted); padding: 0 16px 6px; min-height: 1.2em; }
  #tdsyncbox { display: flex; align-items: center; justify-content: center; width: fit-content; max-width: calc(100% - 28px); margin: 8px auto 4px; padding: 5px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; }
  #tdsyncstat { flex: 1; font-size: calc(var(--fs) * .72); color: var(--muted); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #tdsyncdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 7px; background: #e5484d; vertical-align: 2px; }
  #tdsyncbtn { margin: 0 0 0 8px; padding: 3px 10px; font-size: calc(var(--fs) * .68); vertical-align: 2px; }
  #tdsyncbtn:active { transform: scale(.96); }
  #tdsyncbtn[disabled] { opacity: .55; }
  #tdsynctime { font-size: calc(var(--fs) * .6); color: var(--mut); margin-left: 7px; font-weight: 400; vertical-align: 2px; }
  #verbadge { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 2px); left: 50%; transform: translateX(-50%); z-index: 39; font-family: var(--uifont); font-size: 11px; letter-spacing: .03em; color: var(--mut); opacity: .85; pointer-events: none; white-space: nowrap; }
  .memocountwrap { flex: none; width: 44px; text-align: right; font-family: var(--uifont); font-size: 10.5px; color: var(--muted); }
  #memosyncbar { text-align: center; font-family: var(--uifont); font-size: calc(var(--fs) * .72); color: var(--muted); padding: 0 16px 6px; min-height: 1.2em; cursor: pointer; }
  #memosyncbar .err { color: var(--danger); }
  #memosyncbar .sbhint { text-decoration: underline; text-underline-offset: 2px; }
  .memosearchrow { padding: 2px 14px 4px; }
  .memosearchrow input { width: 100%; box-sizing: border-box; background: var(--card); border: 1px solid var(--line); border-radius: 999px; color: var(--text); font-family: var(--uifont); font-size: 16px; padding: 9px 16px; outline: none; }
  #view-memo main { padding-bottom: 120px; }

function ensureFontLoaded(f){

function defaultSettings(){ return { theme:'sumi', fontSize:'standard', fontFamily:'mincho', lineHeight:'standard' }; }
function normalizeEntry(e){
  if(!e || typeof e!=='object') return null;
  const id = (typeof e.id==='string' && e.id) ? e.id : genId();
  return {
    id: id,
    date: (typeof e.date==='string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date)) ? e.date : todayStr(),
    time: (typeof e.time==='string' && e.time) ? e.time : null,
    text: typeof e.text==='string' ? e.text : '',
    photoNames: Array.isArray(e.photoNames) ? e.photoNames.filter(x=>typeof x==='string') : [],
    photoFileIds: Array.isArray(e.photoFileIds) ? e.photoFileIds.filter(x=>typeof x==='string') : [],
    photosInline: Array.isArray(e.photosInline) ? e.photosInline.filter(x=>typeof x==='string' && x.indexOf('data:image/')===0) : [],
    createdAt: typeof e.createdAt==='number' ? e.createdAt : Date.now(),
    updatedAt: typeof e.updatedAt==='number' ? e.updatedAt : Date.now(),
    deleted: e.deleted===true
  };
}
function normalizeData(d){
  const out = { version:1, entries:[], settings: defaultSettings() };
  if(d && typeof d==='object'){
    if(Array.isArray(d.entries)){ for(const e of d.entries){ const n=normalizeEntry(e); if(n) out.entries.push(n); } }
    if(d.settings && typeof d.settings==='object'){
      if(['sumi','ocher','spandrel','kinari','wood-wenge','wood-teak','wood-walnut-smoke','wood-sugi','wood-hinoki'].includes(d.settings.theme)) out.settings.theme=d.settings.theme;
      if(['small','standard','large','xlarge'].includes(d.settings.fontSize)) out.settings.fontSize=d.settings.fontSize;
      if(FONTFAMS.some(f=>f.id===d.settings.fontFamily)) out.settings.fontFamily=d.settings.fontFamily;
      if(LINEHEIGHTS.some(l=>l.id===d.settings.lineHeight)) out.settings.lineHeight=d.settings.lineHeight;
    }
  }
  return out;
}

function cmpDesc(a,b){
  if(a.date!==b.date) return a.date<b.date?1:-1;
  const ta=a.time||'99:99', tb=b.time||'99:99';
  if(ta!==tb) return ta<tb?1:-1;
  return b.createdAt-a.createdAt;
}

/* エントリ単位マージ：updatedAt が新しい方を採用、同点なら tombstone 優先。写真参照は和集合を保持。 */
function mergeData(local, remote){
  const map=new Map();
  const put=(e)=>{
    const cur=map.get(e.id);
    if(!cur){ map.set(e.id, e); return; }
    let winner;
    if(e.updatedAt>cur.updatedAt) winner=e;
    else if(e.updatedAt<cur.updatedAt) winner=cur;
    else winner = (e.deleted && !cur.deleted) ? e : cur;
    const loser = winner===e ? cur : e;
    winner = Object.assign({}, winner);
    winner.photoNames = Array.from(new Set([].concat(winner.photoNames||[], loser.photoNames||[])));
    winner.photoFileIds = Array.from(new Set([].concat(winner.photoFileIds||[], loser.photoFileIds||[])));
    winner.photosInline = Array.from(new Set([].concat(winner.photosInline||[], loser.photosInline||[])));
    map.set(e.id, winner);
  };
  (local.entries||[]).forEach(put);
  (remote.entries||[]).forEach(put);
  const merged = normalizeData({ version:1, entries:Array.from(map.values()), settings: local.settings });
  return merged;
}

let currentView='list';

function moveNavInd(animate){
  const ind=$('navind'); if(!ind) return;
  const b=document.querySelector('#pillnav button.on') || $('nav-'+(prevView||'list')) || $('nav-list'); if(!b) return;
  const x=b.offsetLeft, w=b.offsetWidth;
  if(!w) return;
  ind.style.width=w+'px';
  const from=lastNavX, to=x;
  ind.style.left=to+'px';
  lastNavX=to;
  if(!animate){ ind.style.transition='none'; requestAnimationFrame(()=>{ ind.style.transition=''; }); }
}
function pinNav(){
  /* iOS standalone shrinks the fixed-position frame when the page is not
     scrollable, floating the bar up by ~59px. Measure the real gap to
     the screen bottom and compensate so the bar always sits 15px above it. */
  const nav=$('pillnav'); if(!nav || nav.style.display==='none') return;
  nav.style.bottom='15px';
  const gap=window.innerHeight - nav.getBoundingClientRect().bottom;
  if(Math.abs(gap-15)>2) nav.style.bottom=(30-gap)+'px';
}
window.addEventListener('resize', ()=>{ moveNavInd(false); pinNav(); });
function healNav(){
  const nav=$('pillnav'); if(!nav || nav.style.display==='none') return;
  pinNav();
  nav.style.opacity='0.99';
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ nav.style.opacity=''; }); });
}
let navHealTimer=null;
window.addEventListener('scroll', ()=>{ if(navHealTimer) clearTimeout(navHealTimer); navHealTimer=setTimeout(healNav, 160); }, { passive:true });

let calY=new Date().getFullYear(), calM=new Date().getMonth();
let selectedDate=todayStr();
function calGridHTML(y, m){
  const first=new Date(y, m, 1);
  const startOffset=(first.getDay()+6)%7; /* 月曜始まり */
  const startDate=new Date(y, m, 1-startOffset);
  const have=new Set(visibleEntries().map(e=>e.date));
  let html=['月','火','水','木','金','土','日'].map((w,i)=>'<div class="dowh'+(i===5?' sat':(i===6?' sun':''))+'">'+w+'</div>').join('');
  for(let i=0;i<42;i++){
    const d=new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate()+i);
    const ds=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    const dow=(d.getDay()+6)%7; /* 0=月 .. 6=日 */
    const cls=['calcell'];
    if(d.getMonth()!==m) cls.push('dim');
    if(dow===5) cls.push('sat'); if(dow===6) cls.push('sun');
    if(ds===todayStr()) cls.push('today');
    if(ds===selectedDate) cls.push('sel');
    if(have.has(ds)) cls.push('has');
    html+='<button class="'+cls.join(' ')+'" onclick="pickDate(\''+ds+'\')"><span class="tnum">'+d.getDate()+'</span></button>';
  }
  return html;
}
function calWrapW(){ const w=$('calwrap'); return w ? w.clientWidth : 0; }
function calTrackReset(){
  const tr=$('caltrack'); if(!tr) return;
  tr.classList.remove('anim');

}
function renderCalendar(){
  $('calmonth').textContent = calY+'年'+(calM+1)+'月';
  const pm=new Date(calY, calM-1, 1), nm=new Date(calY, calM+1, 1);
  $('calprev').innerHTML=calGridHTML(pm.getFullYear(), pm.getMonth());
  $('calgrid').innerHTML=calGridHTML(calY, calM);
  $('calnext').innerHTML=calGridHTML(nm.getFullYear(), nm.getMonth());
  calTrackReset();
  const es=visibleEntries().filter(e=>e.date===selectedDate).sort(cmpDesc);
  $('caldaylist').innerHTML = '<div class="caldayhead">'+fmtDateLabel(selectedDate)+'</div>'+
    (es.length ? es.map(entryCardHTML).join('') : '<div class="empty">この日の日記はありません。</div>');

let calAnim=null; /* 進行中の月スライド {delta} */
let calSuppressClickUntil=0;
function shiftMonth(delta){ calM+=delta; if(calM<0){ calM=11; calY--; } if(calM>11){ calM=0; calY++; } }
function settleMonth(delta){
  /* delta: 1=翌月へ / -1=前月へ / 0=元の月へ戻る。今の位置からアニメーションで確定位置まで滑らせる */
  if(calAnim) return;
  const tr=$('caltrack'); const W=calWrapW();
  if(!tr || !W){ if(delta){ shiftMonth(delta); renderCalendar(); } return; }
  calAnim={delta:delta};
  tr.classList.add('anim');
  tr.style.transform='translateX('+(-(1+delta)*W)+'px)';
  setTimeout(finishMonthSlide, 380);
}
function finishMonthSlide(){
  if(!calAnim) return;
  const delta=calAnim.delta; calAnim=null;
  if(delta) shiftMonth(delta);
  renderCalendar();
}
function pickDate(ds){
  if(calAnim) return;
  if(Date.now()<calSuppressClickUntil) return;
  selectedDate=ds;
  const d=parseDateStr(ds);
  if(d && (d.getFullYear()!==calY || d.getMonth()!==calM)){
    const diff=(d.getFullYear()-calY)*12+(d.getMonth()-calM);
    if(diff===1 || diff===-1){ settleMonth(diff); return; }
    calY=d.getFullYear(); calM=d.getMonth();
  }
  renderCalendar();
}

(function initCalSwipe(){
  let sx=0, sy=0, tracking=false, lock=null, dxCur=0;
  const wrap=$('calwrap'); const tr=$('caltrack');
  wrap.addEventListener('touchstart', (ev)=>{ if(ev.touches.length===1 && !calAnim){ sx=ev.touches[0].clientX; sy=ev.touches[0].clientY; tracking=true; lock=null; dxCur=0; } }, {passive:true});

const TAG_RE = /[#＃]([^\s#＃、。，．！？!?,.;:・「」『』（）()[\]{}<>＜＞"“”'‘’/\\|｜]+)/g;
function entryTags(e){
  const out=[]; const seen=new Set();
  const re=new RegExp(TAG_RE.source, 'g');
  let m; const text=e.text||'';
  while((m=re.exec(text))){ const t=m[1]; if(t && !seen.has(t)){ seen.add(t); out.push(t); } }
  return out;
}
function allTags(){
  const map=new Map();
  visibleEntries().forEach(e=>{ entryTags(e).forEach(t=>map.set(t, (map.get(t)||0)+1)); });
  return Array.from(map.entries()).sort((a,b)=> (b[1]-a[1]) || (a[0]<b[0]?-1:1));
}
function tagChipHTML(t, cnt){

}
function linkifyTags(escapedHtml){
  return escapedHtml.replace(new RegExp(TAG_RE.source, 'g'), (m,t)=>'<button class="taglink" onclick="openTag(\''+escA(t)+'\')">#'+esc(t)+'</button>');
}

/* ---------- sound (Web Audio synthesized feedback; small, short, quiet) ---------- */
const SOUND_MASTER_MUTE = true; /* 2026-11-13: mute all sounds for now (Shoma's all-apps instruction). Settings UI + saved on/off + volume are kept; set this back to false to re-enable. */
let soundOn = true; try { soundOn = localStorage.getItem('diaryStandalone.sound.v1') !== '0'; } catch (e) {}
let soundVol = 1; try { const sv = parseFloat(localStorage.getItem('diaryStandalone.soundVol.v1')); if (isFinite(sv) && sv >= 0 && sv <= 1) soundVol = sv; } catch (e) {}
let AC = null;
function audioCtx() {
  if (SOUND_MASTER_MUTE || !soundOn) return null;
  if (!AC) {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (AC.state !== 'running') { AC.resume(); }
  return AC;
}
function tone(ac, f0, f1, delay, dur, peak, type) {
  const t = ac.currentTime + 0.03 + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(peak * soundVol, 0.0001), t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function playSound(kind) {
  if (SOUND_MASTER_MUTE || !soundOn) return;
  const ac = audioCtx(); if (!ac) return;
  if (kind === 'done') { tone(ac, 784, 784, 0, 0.09, 0.12, 'triangle'); tone(ac, 1047, 1047, 0.07, 0.15, 0.12, 'triangle'); }
  else if (kind === 'save') { tone(ac, 587, 587, 0, 0.1, 0.09, 'sine'); }
  else if (kind === 'sync') { tone(ac, 523, 523, 0, 0.09, 0.065, 'sine'); tone(ac, 784, 784, 0.08, 0.14, 0.065, 'sine'); }
  else if (kind === 'trash') { tone(ac, 330, 185, 0, 0.17, 0.09, 'triangle'); }
  else if (kind === 'tap') { tone(ac, 800, 800, 0, 0.03, 0.05, 'triangle'); }
  else if (kind === 'restore') { tone(ac, 440, 440, 0, 0.07, 0.07, 'sine'); tone(ac, 659, 659, 0.06, 0.12, 0.07, 'sine'); }
}
document.addEventListener('pointerdown', function () {
  const ac = audioCtx(); if (!ac || AC._warmed) return;
  AC._warmed = true;
  tone(ac, 440, 440, 0, 0.02, 0.0001, 'sine');
}, true);
document.addEventListener('pointerdown', function (e) {
  if (!soundOn) return;
  const t = e.target;
  const b = t && t.closest ? t.closest('button, a, [onclick]') : null;
  if (!b || b.disabled) return;
  playSound('tap');
}, true);
function setSoundOn(onOff) {
  soundOn = !!onOff;
  try { localStorage.setItem('diaryStandalone.sound.v1', soundOn ? '1' : '0'); } catch (e) {}
  renderSettingsPanel();

}
function setSoundVol(v, preview) {
  soundVol = Math.min(100, Math.max(0, +v || 0)) / 100;
  try { localStorage.setItem('diaryStandalone.soundVol.v1', String(soundVol)); } catch (e) {}
  const el = document.getElementById('sndvolval'); if (el) el.textContent = Math.round(soundVol * 100) + '%';
  if (preview) playSound('done');
}

/* v2.35: 写真は端末内コピーに加えて、縮小コピーを diary.json の photosInline に
   埋め込んでいつもの中継同期で Drive に届ける（写真用トークンが無くても届く）。 */
function downscaleDataUrl(dataUrl, maxDim, quality){
  return new Promise((resolve)=>{
    const img=new Image();
    img.onload=()=>{ try{
      let w=img.naturalWidth, h=img.naturalHeight;
      const scale=Math.min(1, maxDim/Math.max(w,h));
      if(scale>=1){ resolve(dataUrl); return; }
      w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      resolve(cv.toDataURL('image/jpeg', quality));
    }catch(err){ resolve(dataUrl); } };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}
async function makeInlineCopy(dataUrl){
  let out=await downscaleDataUrl(dataUrl, 1280, 0.78);
  if(out.length>900000) out=await downscaleDataUrl(dataUrl, 1000, 0.68);
  return out;
}
async function ensureInlinePhotos(e){
  if(!e) return false;
  const local=LocalPhotos[e.id]||[];
  if(!Array.isArray(e.photosInline)) e.photosInline=[];
  if(e.photosInline.length>=local.length) return false;
  for(let i=e.photosInline.length;i<local.length;i++){
    e.photosInline.push(await makeInlineCopy(local[i]));
  }
  e.updatedAt=Date.now(); saveDB();
  return true;
}
async function migrateInlinePhotos(){
  for(const e of DB.entries){ if(!e.deleted && (LocalPhotos[e.id]||[]).length) await ensureInlinePhotos(e); }
}
function onPhotoFile(input){
  const file=input.files && input.files[0]; input.value='';
  const e=entryById(currentEntryId); if(!file || !e) return;
  processPhotoFile(file).then(async (dataUrl)=>{
    if(!LocalPhotos[e.id]) LocalPhotos[e.id]=[];
    LocalPhotos[e.id].push(dataUrl); saveLocalPhotos();
    await ensureInlinePhotos(e);
    e.updatedAt=Date.now(); saveDB(); renderEntryPhotos(); scheduleSync();
  }).catch(()=>{ sheetInfo('写真', '写真を読み込めませんでした。'); });
}
function processPhotoFile(file){
  return new Promise((resolve, reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        const max=1600; let w=img.naturalWidth, h=img.naturalHeight;
        const scale=Math.min(1, max/Math.max(w,h)); w=Math.round(w*scale); h=Math.round(h*scale);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL('image/jpeg', 0.82));
      }catch(err){ reject(err); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src=url;
  });
}

/* ---------- import / export ---------- */
function onImportFile(input){
  const file=input.files && input.files[0]; input.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=normalizeData(JSON.parse(String(reader.result)));
      const before=DB.entries.length;
      DB=mergeData(DB, data);
      saveDB();
      sheetInfo('取り込み完了', '取り込みました（全 '+DB.entries.length+' 件／新規 '+(DB.entries.length-before)+' 件）。');
      scheduleSync();
    }catch(e){ sheetInfo('取り込み失敗', 'JSONファイルとして読み込めませんでした。'); }
  };
  reader.onerror=()=>sheetInfo('取り込み失敗', 'ファイルを読み込めませんでした。');
  reader.readAsText(file);
}
function downloadBlob(name, blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}
function exportAllText(){
  const es=visibleEntries().slice().sort(cmpAsc);
  const parts=es.map(e=>{
    let head=fmtDateLabel(e.date)+(e.time?' '+e.time:'');
    let body=e.text||'';
    if((e.photoNames||[]).length) body+='\n［写真］ '+e.photoNames.join('、');
    return head+'\n'+body;
  });
  const text=parts.join('\n\n----------\n\n')+'\n';
  downloadBlob('diary-all.txt', new Blob([text], { type:'text/plain;charset=utf-8' }));
}

const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
const DRIVE_API='https://www.googleapis.com/drive/v3';

let syncStatus='disconnected'; /* disconnected | syncing | synced | error */
let syncMsg='';

const DEFAULT_CLIENT_ID='386087008053-de53ufnkvcnbjslkuhmq2l2pm9fj4c2t.apps.googleusercontent.com';
function getClientId(){ return (storeGet(LS_CID)||'').trim() || DEFAULT_CLIENT_ID; }
function getValidToken(){
  const tok=storeGet(SS_TOKEN);

function storeToken(tok, expiresInSec){
  storeSet(SS_TOKEN, tok);
  storeSet(LS_TOKEN_EXP, String(Date.now() + (expiresInSec||3600)*1000));
  storeDel(LS_AUTH_ERR);
}
function clearToken(){
  storeDel(SS_TOKEN);
  storeDel(LS_TOKEN_EXP);
  storeDel(LS_AUTH_ERR);
}
function setSyncStatus(st, msg){

function renderSyncStatus(){

  else if(syncStatus==='syncing') label='同期中…';
  else if(syncStatus==='error'){ label='同期エラー'+(syncMsg ? '：'+syncMsg : ''); cls='err'; }
  else if(relayReady()) label='中継で接続済み（未同期）';
  else label='中継未設定（端末内に保存中）';
  if (todoDirty) label += '・未保存の変更あり';
  const bar=$('syncbar'); if(bar) bar.innerHTML='<span class="'+cls+'">'+esc(label)+'</span>';
  const st=$('syncstat'); if(st) st.innerHTML='<span class="'+cls+'">'+esc(label)+'</span>';
  renderSyncDot();

  if (typeof renderMemoSyncNote === 'function') renderMemoSyncNote();

function scheduleSync(){
  if(!relayReady()) return;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{ syncNow('auto'); }, 1500);
}
function redirectUri(){ return location.origin + location.pathname; }

function connectDrive(){
  const cid=getClientId();
  if(!cid){ sheetInfo('Drive接続', '先に OAuth クライアントID を入力してください。'); return; }
  storeSet(LS_CID, cid);
  if(!(window.google && google.accounts && google.accounts.oauth2)){
    sheetInfo('Drive接続', 'Googleのライブラリを読み込めませんでした。通信環境を確認して、もう一度お試しください。'); return;
  }
  try{
    const tc=google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: DRIVE_SCOPE,
      ux_mode: 'popup',
      callback: function(resp){
        if(resp && resp.access_token){
          storeToken(resp.access_token, parseInt(resp.expires_in||'3600',10));
          storeDel(LS_PENDING);
          uploadPendingPhotos();
          if(currentEntryId) renderEntryPhotos();
          sheetInfo('写真用 Google 接続', '写真の表示・アップロードができるようになりました。（同期は中継が担当します）');
        } else {
          setSyncStatus('error', 'トークンを取得できませんでした');
        }
      },
      error_callback: function(err){
        const t='認証エラー：'+((err && (err.type || err.message)) || 'unknown');
        storeSet(LS_AUTH_ERR, t);
        sheetInfo('写真用 Google 接続', t);
        storeDel(LS_PENDING);
      }
    });
    storeSet(LS_PENDING, String(Date.now()));
    tc.requestAccessToken();
  }catch(e){
    sheetInfo('Drive接続', '接続を開始できませんでした：'+(e && e.message ? e.message : e));
  }
}
function disconnectDrive(){
  const tok=getValidToken();
  if(tok && window.google && google.accounts && google.accounts.oauth2){
    try{ google.accounts.oauth2.revoke(tok, function(){}); }catch(e){}
  }
  clearToken(); renderSyncStatus();
  if(currentEntryId) renderEntryPhotos();
}
function checkAuthRedirect(){
  let handled=null;
  const hadPending=!!storeGet(LS_PENDING);
  if(location.hash && location.hash.indexOf('access_token')>=0){
    const p=new URLSearchParams(location.hash.slice(1));
    const tok=p.get('access_token');
    const exp=parseInt(p.get('expires_in')||'3600', 10);
    if(tok){ storeToken(tok, exp); storeDel(LS_PENDING); handled='token'; }
    try{ history.replaceState(null, '', location.pathname+location.search); }catch(e){}
  } else if(location.hash && location.hash.indexOf('error')>=0){
    const p=new URLSearchParams(location.hash.slice(1));
    const errTxt='認証エラー：'+(p.get('error')||'unknown')+((p.get('error_description')) ? '（'+p.get('error_description')+'）' : '');
    storeSet(LS_AUTH_ERR, errTxt);
    setSyncStatus('error', errTxt);
    storeDel(LS_PENDING);
    handled='error';
    try{ history.replaceState(null, '', location.pathname+location.search); }catch(e){}
  } else if(location.hash && location.hash.length>1){
    const noteTxt='認証の戻り（トークンなし）：'+location.hash.slice(0,120);
    storeSet(LS_AUTH_ERR, noteTxt);
    setSyncStatus('error', noteTxt);
    storeDel(LS_PENDING);
    handled='error';
    try{ history.replaceState(null, '', location.pathname+location.search); }catch(e){}
  }
  if(!handled && hadPending && !isDriveConnected()){
    const diagTxt='診断：接続ボタンは押されましたが、認証の戻り（URLの # 以降）が確認できませんでした';
    storeSet(LS_AUTH_ERR, diagTxt);
    setSyncStatus('error', diagTxt);
    storeDel(LS_PENDING);
    handled='error';
  }
  return handled;
}
function trySilentRefresh(){
  const cid=getClientId(); if(!cid) return;
  if(!(window.google && google.accounts && google.accounts.oauth2)) return;
  try{
    const tc=google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: DRIVE_SCOPE,
      ux_mode: 'popup',
      callback: function(resp){
        if(resp && resp.access_token){ storeToken(resp.access_token, parseInt(resp.expires_in||'3600',10)); uploadPendingPhotos(); if(currentEntryId) renderEntryPhotos(); }
      },
      error_callback: function(){ /* 写真用トークンを取れなかっただけ：同期状態には触らない */ }
    });
    tc.requestAccessToken({ prompt: '' });
  }catch(e){}
}

/* ---------- 中継（Apps Script）: v2.21 ----------
   A relay deployed under the user's own Google account reads and
   writes this app's JSON files (server-side name allowlist +
   shared secret). When configured, sync needs no Google token at
   all, so the connection can never lapse. URL + secret live only in
   this device's localStorage. As of v2.23 sync never falls back to
   GIS: GIS remains only for entry photos. In relay mode a file's
   "id" is its name.
   driveFetch is the single chokepoint for list + download calls in
   every flow (diary / todo / memo / price-check), so branching here
   covers them all; uploads route through driveUploadPatch /
   driveUploadCreate below. */
const LS_RELAY='diaryStandalone.relay';
/* v2.22: the relay URL is not a secret (without the secret every
   call is rejected), so it is embedded as the default — the user
   pastes only the secret, once. The secret itself must never be
   embedded: this file is public, and whoever holds the secret can
   read and write the app's Drive files. */
const RELAY_URL_DEFAULT='https://script.google.com/macros/s/AKfycbziV1Wpv7AWSUJJgaKyRzFeBR81Td4CjryGGuq4avt1xAo-e2mbeyS2vBpCuqx4_KI/exec';
function relayCfg(){ try{ const r=JSON.parse(storeGet(LS_RELAY)||'null'); return (r && r.secret) ? { url: r.url || RELAY_URL_DEFAULT, secret: r.secret } : null; }catch(e){ return null; } }
function relayReady(){ return !!relayCfg(); }
async function relayCall(op, name, content){
  const c=relayCfg(); if(!c) throw new Error('中継が未設定です');
  const res=await fetch(c.url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ secret:c.secret, op:op, name:name, content:content }) });
  if(!res.ok) throw new Error('中継 HTTP '+res.status);
  const j=JSON.parse(await res.text());
  if(!j || !j.ok) throw new Error('中継エラー：'+((j && j.error) || 'unknown'));
  return j;
}
function relayFakeRes(jsonObj, text){
  return { ok:true, status:200,
    json: async()=> jsonObj,
    text: async()=> (text !== undefined ? text : JSON.stringify(jsonObj)) };
}
async function relayDriveFetch(path){
  const listM=/^\/files\?q=/.exec(path);
  if(listM){
    const q=decodeURIComponent(path.slice('/files?q='.length).split('&')[0]);
    const nm=/name='([^']+)'/.exec(q);
    if(!nm) throw new Error('中継：解釈できない検索です');
    const st=await relayCall('stat', nm[1]);
    return relayFakeRes({ files: st.exists ? [{ id:nm[1], name:nm[1] }] : [] });
  }
  const dlM=/^\/files\/([^?]+)\?alt=media/.exec(path);
  if(dlM){
    const got=await relayCall('get', decodeURIComponent(dlM[1]));
    return relayFakeRes(null, got.content);
  }
  if(/^\/files\/[^?]+\?fields=headRevisionId/.test(path)) return relayFakeRes({ headRevisionId:null });
  throw new Error('中継：未対応のリクエストです');
}
async function driveUploadPatch(fileId, bodyStr, tok){
  if(relayReady()){ await relayCall('put', fileId, bodyStr); return { ok:true, status:200 }; }
  throw new Error('中継が未設定です');
}
async function driveUploadCreate(name, bodyStr, tok){
  if(relayReady()){ await relayCall('put', name, bodyStr); return { ok:true, status:200, json: async()=>({ id:name }) }; }
  throw new Error('中継が未設定です');
}
function relaySaveAndTest(){
  const u=$('relayurl'), s=$('relaysecret'), st=$('relaystat');
  const url=(u ? u.value : '').trim() || RELAY_URL_DEFAULT, secret=(s ? s.value : '').trim();
  if(!secret){ if(st) st.textContent='シークレットを入力してください（URLは入力済みです）'; return; }
  storeSet(LS_RELAY, JSON.stringify({ url:url, secret:secret }));
  if(st) st.textContent='接続テスト中…';
  relayCall('ping').then(()=>{
    if(st) st.textContent='接続OK — この端末では Google ログインなしで同期します。';
    renderSyncStatus();
    syncNow('relay');
  }).catch(e=>{ if(st) st.textContent='接続に失敗しました：'+((e && e.message) || e); });
}
function relayClear(){
  storeDel(LS_RELAY);
  const u=$('relayurl'), s=$('relaysecret'), st=$('relaystat');
  if(u) u.value=''; if(s) s.value=''; if(st) st.textContent='未設定です。';
  renderSyncStatus();
}

async function driveFetch(path, opts){
  /* v2.23: sync transport is relay-only. GIS no longer carries sync;
     it remains solely for entry photos (upload + display). */
  if(relayReady()) return relayDriveFetch(path);
  throw new Error('中継が未設定です');
}
function dataURLtoBlob(dataUrl){
  const m=/^data:([^;,]+)?(;base64)?,(.*)$/.exec(dataUrl||'');
  if(!m) return new Blob([]);
  if(m[2]){ const bin=atob(m[3]); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr], { type:m[1]||'image/jpeg' }); }
  return new Blob([decodeURIComponent(m[3])], { type:m[1]||'image/jpeg' });
}
async function uploadPendingPhotos(){
  const tok=getValidToken(); if(!tok) return;
  for(const entryId of Object.keys(LocalPhotos)){
    const e=entryById(entryId); if(!e) continue;
    const arr=LocalPhotos[entryId]||[];
    const remaining=[];
    const successIdx=[];
    for(let i=0;i<arr.length;i++){
      try{
        const name='photo_'+entryId+'_'+((e.photoFileIds||[]).length+ (arr.length-remaining.length)) +'.jpg';
        const meta={ name:name, mimeType:'image/jpeg' };
        const form=new FormData();
        form.append('metadata', new Blob([JSON.stringify(meta)], { type:'application/json' }));
        form.append('file', dataURLtoBlob(arr[i]), name);
        const res=await fetch(UPLOAD_API+'/files?uploadType=multipart&fields=id', { method:'POST', headers:{ Authorization:'Bearer '+tok }, body: form });
        if(!res.ok) throw new Error('photo upload HTTP '+res.status);
        const j=await res.json();
        if(j && j.id){ e.photoFileIds=(e.photoFileIds||[]).concat([j.id]); e.updatedAt=Date.now(); successIdx.push(i); }
        else remaining.push(arr[i]);
      }catch(err){ remaining.push(arr[i]); }
    }
    if(successIdx.length && (e.photosInline||[]).length===arr.length){ e.photosInline=e.photosInline.filter((_,idx)=>successIdx.indexOf(idx)<0); }
    if(remaining.length) LocalPhotos[entryId]=remaining; else delete LocalPhotos[entryId];
  }
  saveLocalPhotos(); saveDB();
}
async function findDiaryFile(){
  const q=encodeURIComponent("name='diary.json' and trashed=false");
  const res=await driveFetch('/files?q='+q+'&fields='+encodeURIComponent('files(id,name,createdTime,headRevisionId)')+'&orderBy=createdTime');
  if(!res.ok) throw new Error('files.list HTTP '+res.status);
  const j=await res.json();
  const files=(j.files||[]).filter(f=>f.name==='diary.json');
  return files.length ? files[0] : null;
}
async function downloadDiary(fileId){
  const res=await driveFetch('/files/'+encodeURIComponent(fileId)+'?alt=media');
  if(!res.ok) throw new Error('download HTTP '+res.status);
  const text=await res.text();
  return normalizeData(JSON.parse(text));
}
async function getHeadRevision(fileId){
  const res=await driveFetch('/files/'+encodeURIComponent(fileId)+'?fields=headRevisionId');
  if(!res.ok) return null;
  const j=await res.json(); return j.headRevisionId||null;
}
async function uploadDiaryUpdate(fileId, data){
  const tok=null; if(!relayReady()) throw new Error('中継が未設定です');
  const res=await driveUploadPatch(fileId, JSON.stringify(data), tok);
  if(!res.ok) throw new Error('update HTTP '+res.status);
}
async function createDiary(data){
  const tok=null; if(!relayReady()) throw new Error('中継が未設定です');
  const res=await driveUploadCreate('diary.json', JSON.stringify(data), tok);
  if(!res.ok) throw new Error('create HTTP '+res.status);

}

async function syncNow(reason){
  if(reason==='manual') audioCtx();
  if(syncRunning) return;
  if(!relayReady()){ setSyncStatus('disconnected', ''); return; }
  syncRunning=true; setSyncStatus('syncing');
  try{
    await migrateInlinePhotos();
    await uploadPendingPhotos();
    let file=await findDiaryFile();
    if(!file){
      await createDiary(DB);
    } else {
      let remote=await downloadDiary(file.id);
      let merged=mergeData(DB, remote);
      const rev=await getHeadRevision(file.id);
      if(rev && file.headRevisionId && rev!==file.headRevisionId){
        remote=await downloadDiary(file.id);
        merged=mergeData(DB, remote);
      }
      DB=merged; saveDB(); applyAppearance();
      await uploadDiaryUpdate(file.id, DB);
    }
    await syncTodo();
    await syncMemo();
    lastSyncAt=Date.now(); try{ localStorage.setItem('diaryStandalone.lastSyncAt', String(lastSyncAt)); }catch(e){}
    setSyncStatus('synced'); if(reason==='manual') playSound('sync');
    if(currentView==='list') renderList();
    if(currentView==='calendar') renderCalendar();
    if(currentView==='entry') renderEntry();
    if(currentView==='settings') renderSyncStatus();
  }catch(e){
    setSyncStatus('error', (e && e.message) ? e.message : String(e));
  }finally{
    syncRunning=false;
  }
}

function memoFmtDate(iso){
  if(!iso) return '';
  const d=new Date(iso), t=new Date();
  const hm=pad2(d.getHours())+':'+pad2(d.getMinutes());
  if(d.toDateString()===t.toDateString()) return '今日 '+hm;
  const y=new Date(t); y.setDate(t.getDate()-1);
  if(d.toDateString()===y.toDateString()) return '昨日 '+hm;
  return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+hm;
}
function memoNowISO(){ return new Date().toISOString(); }
let memoUidSeq=0;

/* Per-memo merge, identical semantics to the standalone memo app:
   newer updatedAt wins per id; a tombstone at/after updatedAt deletes. */
function mergeMemoData(local, remote){
  const deleted={};
  [local.deleted||{}, remote.deleted||{}].forEach(src=>{ Object.keys(src).forEach(id=>{ if(!deleted[id] || src[id]>deleted[id]) deleted[id]=src[id]; }); });
  const byId={};
  [local.memos||[], remote.memos||[]].forEach(list=>{ list.forEach(m=>{ const ex=byId[m.id]; if(!ex || (m.updatedAt||'')>(ex.updatedAt||'')) byId[m.id]=m; }); });
  const memos=Object.values(byId).filter(m=> !(deleted[m.id] && deleted[m.id]>=(m.updatedAt||'')));
  const fById={};
  [local.folders||[], remote.folders||[]].forEach(list=>{ list.forEach(f=>{ const ex=fById[f.id]; if(!ex || (f.updatedAt||'')>(ex.updatedAt||'')) fById[f.id]=f; }); });
  const folders=Object.values(fById).filter(f=> !(deleted[f.id] && deleted[f.id]>=(f.updatedAt||'')));
  return { memos, deleted, folders };
}

let memoFolderFilter='all', memoTagFilter='', memoLastDeletedFolder=null, memoEditingFolderId=null;
function memoFolderById(id){ return (MemoDB.folders||[]).find(f=>f.id===id)||null; }
function memoEffFolderId(m){ return (m.folderId && memoFolderById(m.folderId)) ? m.folderId : null; }
function memoTagsOf(m){ return Array.isArray(m.tags) ? m.tags : []; }
function memoParseTags(str){
  const out=[];
  String(str||'').split(/[,、]/).forEach(t=>{ const v=t.trim().replace(/['"<>\\]/g,''); if(v && !out.includes(v)) out.push(v); });
  return out.slice(0,20);
}
function memoAllTags(){

}

    const res = await driveFetch('/files?q=' + q + '&fields=' + encodeURIComponent('files(id,name,createdTime)') + '&orderBy=createdTime');
    if (!res.ok) return false;
    const j = await res.json();
    const files = (j.files || []).filter(function (f) { return f.name === 'todo.json'; });
    const tok = null; if (!relayReady()) return false;

      if (todoEditSeq === seq0 && todoDirty) { todoDirty = false; renderSyncStatus(); renderTodoDirty(); }
      return true;
    }
    const file = files[0];

    if (!dl.ok) return false;
    const remote = normalizeTodo(JSON.parse(await dl.text()));
    if (!remote) return false;
    const snap = function (d) { return JSON.stringify({ f: d.folders, l: d.lists, t: d.todos, r: d.trash }); };
    const remoteSnap = snap(remote);
    const merged = mergeTodoDb(TodoDB, remote);
    TodoDB = merged;
    if (migrateTodoStructure()) { TodoDB.updatedAt = Date.now(); }
    saveTodoLocal();
    if (currentView === 'todo') renderTodo();
    if (snap(merged) !== remoteSnap) {
      TodoDB.updatedAt = Date.now(); saveTodoLocal();
      const up = await driveUploadPatch(file.id, JSON.stringify(TodoDB), tok);
      if (!up.ok) return false;
      if (hasUnpricedWishlist(TodoDB)) startPricePolls();
    }
    if (todoEditSeq === seq0 && todoDirty) { todoDirty = false; renderSyncStatus(); renderTodoDirty(); }

}

    const res = await driveFetch('/files?q=' + q + '&fields=' + encodeURIComponent('files(id,name,createdTime)') + '&orderBy=createdTime');
    if (!res.ok) throw new Error('search HTTP ' + res.status);
    const j = await res.json();
    const files = (j.files || []).filter(function (f) { return f.name === 'price-check-request.json'; });
    if (files.length) {
      const up = await driveUploadPatch(files[0].id, payload, tok);

  } catch (e) {
    priceCheckBusy = false;
    if (currentView === 'todo') renderTodo();

    sp.addEventListener('click', hideSplash);
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) hideSplash();
    setTimeout(splashGo, 1500); /* 保険：更新確認が終わらなくても開始する */
    setTimeout(hideSplash, 2800); /* 保険：何があっても必ず消す */
  }
  applyAppearance();
  loadTodo(); renderTodo();
  const authResult=checkAuthRedirect();
  renderList(); renderCalendar(); renderSyncStatus();
  if(relayReady()){
    /* v2.21: a configured relay needs no token — sync on open. */
    setTimeout(()=>syncNow('startup'), 300);
    /* 写真表示用にトークンを静かに戻す（同期はしない） */
    setTimeout(trySilentRefresh, 1200);
  } else if(authResult==='token'){
    /* 写真用トークンが戻っただけ：写真のアップロードだけ処理する */
    setTimeout(()=>{ uploadPendingPhotos(); }, 300);
  } else if(authResult==='error'){
    /* 認証エラーを表示したままにする（サイレント更新で上書きしない） */
  } else if(getClientId() && storeGet(LS_AUTH_ERR)){
    setSyncStatus('error', storeGet(LS_AUTH_ERR));
  } else if(getClientId()){
    /* 写真表示用にトークンを静かに戻す（同期はしない） */
    setTimeout(trySilentRefresh, 800);
  }
  checkForUpdate();
  requestAnimationFrame(()=>moveNavInd(false));
})();
</script>
</body>
</html>
