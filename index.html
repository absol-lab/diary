<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日記</title>
<meta name="application-name" content="日記">
<meta name="apple-mobile-web-app-title" content="日記">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="IMG_2278.png">
<link rel="icon" type="image/png" href="IMG_2278.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Old+Mincho:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;500&family=Zen+Kurenaido&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    --fs: 16px;
    background: var(--bg); color: var(--text);
    font-size: var(--fs); line-height: var(--lh, 1.7);
    padding-bottom: 108px;
    -webkit-text-size-adjust: 100%;
  }
  body[data-fontfamily="mincho"] { font-family: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "YuMincho", "Yu Mincho", "Noto Serif JP", serif; }
  body[data-fontfamily="gothic"] { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body[data-fontsize="small"]  { --fs: 14px; }
  body[data-fontsize="standard"] { --fs: 16px; }
  body[data-fontsize="large"]  { --fs: 18px; }
  body[data-fontsize="xlarge"] { --fs: 20px; }

  body[data-theme="sumi"] {
    --bg:#000000; --bg2:#101012; --card:#26262b; --card2:#33333a;
    --text:#f4f4f6; --muted:#9c9ca4; --accent:#d9d9e0; --line:#33333a;
    --danger:#ff453a; --sat:#5e9bff; --sun:#ff6b61; --nav:rgba(26,26,30,.92);
    --sheet:rgba(0,0,0,.55); --fab:#a9a9b0; --fabink:#ffffff;
  }
  body[data-theme="ocher"] {
    --bg:#16110b; --bg2:#1d1610; --card:#251c12; --card2:#2f2416;
    --text:#f4ecdc; --muted:#b3a58c; --accent:#d9a441; --line:#3a2d1c;
    --danger:#ff5a47; --sat:#6ea8d8; --sun:#e07856; --nav:rgba(33,25,16,.94);
    --sheet:rgba(0,0,0,.55); --fab:#d9a441; --fabink:#16110b;
  }
  body[data-theme="spandrel"] {
    --bg:#0e100e; --bg2:#141713; --card:#191d18; --card2:#22271f;
    --text:#eef0e4; --muted:#a3ab97; --accent:#c9cfae; --line:#2c332a;
    --danger:#ff5a47; --sat:#7ba7c9; --sun:#d98a7a; --nav:rgba(22,26,21,.94);
    --sheet:rgba(0,0,0,.55); --fab:#c9cfae; --fabink:#0e100e;
  }
  body[data-theme="kinari"] {
    --bg:#f1ebda; --bg2:#eae2cd; --card:#faf6ea; --card2:#f3eddb;
    --text:#211d14; --muted:#7a7261; --accent:#57503e; --line:#ddd2b8;
    --danger:#c23b2e; --sat:#2f6fb2; --sun:#c23b2e; --nav:rgba(250,246,234,.95);
    --sheet:rgba(60,52,32,.35); --fab:#57503e; --fabink:#f1ebda;
  }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--accent); }

  /* ---------- top bar ---------- */
  .uifont { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 6px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
    background: var(--bg);
  }
  .topbar .ttl { flex: 1; text-align: center; font-size: calc(var(--fs) * 1.12); letter-spacing: .08em; font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .iconbtn { min-width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; font-size: calc(var(--fs) * 1.05); color: var(--text); border-radius: 12px; }
  .iconbtn:active { background: var(--card); }
  .roundbtn {
    width: 46px; height: 46px; flex: none; border-radius: 50%;
    background: var(--card); border: 1px solid var(--line);
    display: inline-flex; align-items: center; justify-content: center; color: var(--text);
  }
  .roundbtn:active { background: var(--card2); }
  .roundbtn svg { width: 23px; height: 23px; }
  .spacer44 { width: 44px; flex: none; }

  #syncbar { text-align: center; font-size: calc(var(--fs) * .72); color: var(--muted); padding: 0 16px 6px; min-height: 1.2em; }
  #syncbar .err { color: var(--danger); }

  main { max-width: 720px; margin: 0 auto; padding: 0 14px; }
  .view { display: none; }
  .view.active { display: block; }

  /* ---------- entry cards ---------- */
  .monthhead { margin: 20px 2px 12px; font-size: calc(var(--fs) * 1.08); color: var(--text); font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .monthhead:first-child { margin-top: 4px; }
  .card {
    position: relative; overflow: hidden;
    display: flex; gap: 16px; width: 100%; text-align: left; align-items: stretch;
    background: var(--card); border: none; border-radius: 14px;
    padding: 16px; margin-bottom: 12px; min-height: 106px;
  }
  .card:active { background: var(--card2); }
  body[data-theme="spandrel"] .card::after {
    content: ""; position: absolute; top: -19px; right: -19px; width: 36px; height: 36px;
    border: 1.5px solid var(--accent); border-radius: 50%; opacity: .55; pointer-events: none;
  }
  .card .when { flex: none; width: 54px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; }
  .card .when .dow { font-size: calc(var(--fs) * .75); }
  .card .when .dow.sat { color: var(--sat); } .card .when .dow.sun { color: var(--sun); }
  .card .when .day { font-size: calc(var(--fs) * 1.9); line-height: 1.3; font-weight: 600; color: #d9d9de; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
  body[data-theme="kinari"] .card .when .day { color: var(--text); }
  .card .when .time { font-size: calc(var(--fs) * .78); margin-top: auto; }
  .card .body { flex: 1; min-width: 0; }
  .card .title { font-size: calc(var(--fs) * 1.25); line-height: 1.5; font-weight: 600; word-break: break-word; }
  .card .preview { margin-top: 4px; font-size: calc(var(--fs) * .85); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .card .photomark { margin-top: 6px; font-size: calc(var(--fs) * .72); color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; font-size: calc(var(--fs) * .9); }

  /* ---------- FAB / pill nav ---------- */
  #fab {
    position: fixed; right: 18px; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); z-index: 40;
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--fab); color: var(--fabink);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 22px rgba(0,0,0,.45);
  }
  #fab svg { width: 28px; height: 28px; }
  #fab:active { transform: scale(.96); }
  #pillnav {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 40;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    width: calc(100vw - 40px); max-width: 560px;
    display: flex; gap: 2px; padding: 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--nav); border: 1px solid var(--line); border-radius: 999px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
  }
  #pillnav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 5px; border-radius: 999px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  #pillnav button svg { width: 23px; height: 23px; }
  #pillnav button.on { background: var(--card2); color: var(--text); font-weight: 600; }

  /* ---------- calendar ---------- */
  .calhead2 { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 12px) 2px 14px; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .calhead2 .chev { width: 40px; height: 44px; font-size: 24px; color: var(--text); display: inline-flex; align-items: center; justify-content: center; }
  .calhead2 .monthpill { flex: 1; text-align: center; background: var(--card); border-radius: 12px; padding: 11px 8px; font-size: calc(var(--fs) * 1.05); font-weight: 600; }
  .calhead2 .todayround { flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 11px 18px; font-size: calc(var(--fs) * .95); background: var(--bg2); }
  .calhead2 .todayround:active { background: var(--card); }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; touch-action: pan-y; border-top: 1px solid var(--line); border-left: 1px solid var(--line); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
  .calgrid .dowh { text-align: center; font-size: calc(var(--fs) * .75); color: var(--muted); padding: 7px 0; background: var(--card); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .calgrid .dowh.sat { color: var(--sat); } .calgrid .dowh.sun { color: var(--sun); }
  .calcell {
    position: relative; aspect-ratio: .94; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--fs) * 1.02);
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background: var(--bg2);
  }
  .calcell.dim { opacity: .32; }
  .calcell .tnum { width: 39px; height: 39px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .calcell.sat .tnum { color: var(--sat); } .calcell.sun .tnum { color: var(--sun); }
  .calcell.has .tnum { background: #83838a; color: #fff; font-weight: 600; }
  body[data-theme="kinari"] .calcell.has .tnum { background: #8a8271; }
  .calcell.sel .tnum { background: #4c4c52; color: #fff; font-weight: 600; }
  body[data-theme="kinari"] .calcell.sel .tnum { background: #57503e; }
  .calcell.today .tnum { border-radius: 7px; box-shadow: inset 0 0 0 2px var(--text); }
  .caldaylist { margin-top: 20px; }
  .caldayhead { font-size: calc(var(--fs) * 1.12); font-weight: 700; margin: 0 2px 12px; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }

  /* ---------- entry view ---------- */
  .entrybar { display: flex; align-items: center; gap: 6px; }
  .datepill {
    flex: 1; text-align: center; font-size: calc(var(--fs) * .82); color: var(--muted);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 10px;
  }
  .entrybody { padding: 14px 4px 10px; }
  .entrybody h1 { font-size: calc(var(--fs) * 1.55); line-height: 1.5; margin: 4px 0 14px; font-weight: 600; word-break: break-word; }
  .entrybody p { margin: 0 0 1em; word-break: break-word; }
  .entrybody .photoline { font-size: calc(var(--fs) * .78); color: var(--muted); margin-top: 14px; }
  #editarea {
    width: 100%; min-height: 46vh; background: var(--card); color: var(--text);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px; line-height: var(--lh, 1.7); resize: vertical;
  }
  .editmeta { display: flex; gap: 10px; margin: 10px 0; }
  .editmeta label { flex: 1; font-size: calc(var(--fs) * .75); color: var(--muted); display: block; }
  .editmeta input {
    width: 100%; margin-top: 4px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; color: var(--text); color-scheme: dark;
  }
  body[data-theme="kinari"] .editmeta input { color-scheme: light; }
  .photogrid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .phototile { position: relative; width: 96px; height: 96px; border-radius: 12px; overflow: hidden; background: var(--card2); border: 1px solid var(--line); }
  .phototile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .phototile .loading { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; color: var(--muted); font-size: 11px; text-align: center; padding: 4px; }
  .phototile .del {
    position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(0,0,0,.65); color: #fff; font-size: 14px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .addphoto {
    margin-top: 12px; padding: 10px 18px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); font-size: calc(var(--fs) * .85);
  }
  .note { font-size: calc(var(--fs) * .72); color: var(--muted); margin-top: 8px; }

  /* ---------- search ---------- */
  .searchbar { display: flex; align-items: center; gap: 8px; }
  .searchbar input {
    flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 11px 16px; color: var(--text); outline: none;
  }
  .searchcount { color: var(--muted); font-size: calc(var(--fs) * .8); margin: 12px 4px; }

  /* ---------- settings ---------- */
  .pillrow {
    display: flex; align-items: center; gap: 15px; width: 100%; text-align: left;
    background: var(--card); border-radius: 999px; padding: 18px 22px; margin-bottom: 26px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .pillrow:active { background: var(--card2); }
  .groupcard { background: var(--card); border-radius: 26px; padding: 4px 20px; margin-bottom: 26px; }
  .srow {
    display: flex; align-items: center; gap: 15px; width: 100%; text-align: left;
    padding: 16px 0; border-bottom: 1px solid var(--line);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .groupcard .srow:last-child { border-bottom: none; }
  button.srow:active { opacity: .6; }
  .srow .ic { flex: none; width: 26px; height: 26px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
  .srow .ic svg { width: 25px; height: 25px; }
  .pillrow .ic { flex: none; width: 26px; height: 26px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
  .pillrow .ic svg { width: 25px; height: 25px; }
  .srow .lb, .pillrow .lb { flex: 1; font-size: calc(var(--fs) * 1.02); min-width: 0; }
  .srow .val { color: var(--muted); font-size: calc(var(--fs) * .95); }
  .srow .chev, .pillrow .chev { color: #6d6d74; font-size: 22px; line-height: 1; }
  .srow.danger .lb { color: var(--danger); }
  .panelnav { display: flex; align-items: center; gap: 6px; margin: 2px 0 16px; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .panelnav .back { min-width: 44px; height: 44px; display: inline-flex; align-items: center; font-size: calc(var(--fs) * .95); color: var(--muted); }
  .panelnav .pttl { flex: 1; text-align: center; font-weight: 700; font-size: calc(var(--fs) * 1.05); }
  .setgroup { margin: 24px 0; }
  .setgroup > h2 { font-size: calc(var(--fs) * .82); color: var(--muted); letter-spacing: .14em; margin: 0 4px 10px; font-weight: 600; }
  .setbox { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .swatch { border: 2px solid transparent; border-radius: 14px; padding: 6px 4px 8px; text-align: center; font-size: calc(var(--fs) * .78); }
  .swatch .chip { height: 40px; border-radius: 9px; border: 1px solid rgba(128,128,128,.35); margin-bottom: 6px; position: relative; overflow: hidden; }
  .swatch.on { border-color: var(--accent); }
  .segrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg { padding: 9px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg2); font-size: calc(var(--fs) * .88); }
  .seg.on { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .setrow { margin-top: 14px; }
  .setrow:first-child { margin-top: 0; }
  .setlabel { font-size: calc(var(--fs) * .8); color: var(--muted); margin-bottom: 6px; }
  .textin {
    width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 12px; color: var(--text); outline: none; font-size: calc(var(--fs) * .85);
  }
  .btn {
    display: inline-block; padding: 11px 20px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card2); font-size: calc(var(--fs) * .9); margin: 4px 6px 4px 0;
  }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn:active { opacity: .75; }
  .syncstat { font-size: calc(var(--fs) * .82); color: var(--muted); margin-top: 8px; }
  .syncstat .err { color: var(--danger); }
  select.textin { appearance: none; -webkit-appearance: none; }

  /* ---------- sheet / modal ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 60; background: var(--sheet);
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.open { display: flex; }
  .sheet {
    width: 100%; max-width: 720px; max-height: 82vh; overflow-y: auto;
    background: var(--bg2); border-top: 1px solid var(--line);
    border-radius: 22px 22px 0 0; padding: 14px 18px calc(env(safe-area-inset-bottom, 0px) + 22px);
  }
  .sheet h3 { margin: 6px 0 12px; font-size: calc(var(--fs) * 1.02); text-align: center; }
  .sheet .msg { font-size: calc(var(--fs) * .92); color: var(--text); margin: 8px 2px 16px; white-space: pre-wrap; }
  .sheetbtn {
    display: block; width: 100%; text-align: center; padding: 15px; margin-top: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; font-size: var(--fs);
  }
  .sheetbtn.danger { color: var(--danger); }
  .sheetbtn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .yearitem { display: block; width: 100%; text-align: center; padding: 14px; font-size: calc(var(--fs) * 1.05); border-radius: 12px; }
  .yearitem.on { background: var(--card); font-weight: 700; }
</style>
</head>
<body data-theme="sumi" data-fontsize="standard" data-fontfamily="mincho">

  <!-- ======= LIST ======= -->
  <section id="view-list" class="view active">
    <div class="topbar">
      <button class="roundbtn" onclick="openYearSheet()" aria-label="年を選ぶ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><line x1="3.5" y1="10" x2="20.5" y2="10"/><line x1="8" y1="3" x2="8" y2="6.5"/><line x1="16" y1="3" x2="16" y2="6.5"/><circle cx="8" cy="14" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="14" r="1.15" fill="currentColor" stroke="none"/><circle cx="16" cy="14" r="1.15" fill="currentColor" stroke="none"/><circle cx="8" cy="17.5" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="17.5" r="1.15" fill="currentColor" stroke="none"/></svg></button>
      <div class="ttl">日記</div>
      <button class="roundbtn" onclick="showView('search')" aria-label="検索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><line x1="15.8" y1="15.8" x2="20.5" y2="20.5"/></svg></button>
    </div>
    <div id="syncbar"></div>
    <main><div id="listwrap"></div></main>
  </section>

  <!-- ======= CALENDAR ======= -->
  <section id="view-calendar" class="view">
    <main>
      <div class="calhead2">
        <button class="chev" onclick="moveMonth(-1)" aria-label="前の月">‹</button>
        <div class="monthpill" id="calmonth"></div>
        <button class="chev" onclick="moveMonth(1)" aria-label="次の月">›</button>
        <button class="todayround" onclick="goToday()">今日</button>
      </div>
      <div class="calgrid" id="calgrid"></div>
      <div class="caldaylist" id="caldaylist"></div>
    </main>
  </section>

  <!-- ======= SEARCH ======= -->
  <section id="view-search" class="view">
    <div class="topbar">
      <button class="iconbtn" onclick="showView('list')" aria-label="戻る">‹</button>
      <div class="ttl">検索</div>
      <div class="spacer44"></div>
    </div>
    <main>
      <div class="searchbar">

<script>
'use strict';
/* ================= utilities ================= */
const $ = (id) => document.getElementById(id);
const DOW = ['日','月','火','水','木','金','土'];
function pad2(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function nowTimeStr(){ const d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function parseDateStr(s){ const p=(s||'').split('-'); if(p.length!==3) return null; const d=new Date(+p[0], +p[1]-1, +p[2]); return isNaN(d.getTime())?null:d; }
function fmtDateLabel(s){ const d=parseDateStr(s); if(!d) return s||''; return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+DOW[d.getDay()]+'）'; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escA(s){ return esc(s).replace(/"/g,'&quot;'); }
function firstLine(text){ const lines=String(text||'').split('\n'); for(const l of lines){ if(l.trim()!=='') return l; } return ''; }
function restPreview(text){
  const lines=String(text||'').split('\n'); let seen=false; const out=[];
  for(const l of lines){ if(!seen){ if(l.trim()!==''){ seen=true; } continue; } out.push(l); }
  return out.join('\n').trim();
}
let _idc = 0;
function genId(){ _idc++; return 'e-'+Date.now().toString(36)+'-'+_idc.toString(36)+Math.floor(Math.random()*1e6).toString(36); }
function storeSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function storeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function storeDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* ================= data store ================= */
const LS_DATA='diaryStandalone.data.v1';
const LS_PHOTOS='diaryStandalone.photos.v1';
const LS_CID='diaryStandalone.clientId';
const LS_TOKEN_EXP='diaryStandalone.tokenExpiry';
const LS_AUTH_ERR='diaryStandalone.authError';
const LS_PENDING='diaryStandalone.pendingConnect';
const SS_TOKEN='diaryStandalone.accessToken';

const FONTFAMS=[
  { id:'mincho', name:'明朝', stack:'"Hiragino Mincho ProN","Hiragino Mincho Pro","YuMincho","Yu Mincho","Noto Serif JP",serif' },
  { id:'gothic', name:'ゴシック', stack:'-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif' },
  { id:'maru', name:'丸ゴシック', stack:'"Hiragino Maru Gothic ProN","TsukuARdGothic","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif' },
  { id:'shippori', name:'しっぽり明朝', stack:'"Shippori Mincho","Hiragino Mincho ProN","Noto Serif JP",serif' },
  { id:'zenmincho', name:'Zen明朝', stack:'"Zen Old Mincho","Hiragino Mincho ProN","Noto Serif JP",serif' },
  { id:'rounded', name:'M PLUS Rounded', stack:'"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif' },
  { id:'kurenaido', name:'手書き（Zen紅）', stack:'"Zen Kurenaido","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif' }
];
const LINEHEIGHTS=[
  { id:'narrow', name:'狭い', val:1.5 },
  { id:'standard', name:'標準', val:1.7 },
  { id:'wide', name:'広い', val:1.9 },
  { id:'xwide', name:'とても広い', val:2.1 }
];
function fontFamById(id){ return FONTFAMS.find(f=>f.id===id) || FONTFAMS[0]; }
function lineHeightById(id){ return LINEHEIGHTS.find(l=>l.id===id) || LINEHEIGHTS[1]; }
function defaultSettings(){ return { theme:'sumi', fontSize:'standard', fontFamily:'mincho', lineHeight:'standard' }; }
function normalizeEntry(e){
  if(!e || typeof e!=='object') return null;
  const id = (typeof e.id==='string' && e.id) ? e.id : genId();
  return {
    id: id,
    date: (typeof e.date==='string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date)) ? e.date : todayStr(),
    time: (typeof e.time==='string' && e.time) ? e.time : null,
    text: typeof e.text==='string' ? e.text : '',
    photoNames: Array.isArray(e.photoNames) ? e.photoNames.filter(x=>typeof x==='string') : [],
    photoFileIds: Array.isArray(e.photoFileIds) ? e.photoFileIds.filter(x=>typeof x==='string') : [],
    createdAt: typeof e.createdAt==='number' ? e.createdAt : Date.now(),
    updatedAt: typeof e.updatedAt==='number' ? e.updatedAt : Date.now(),
    deleted: e.deleted===true
  };
}
function normalizeData(d){
  const out = { version:1, entries:[], settings: defaultSettings() };
  if(d && typeof d==='object'){
    if(Array.isArray(d.entries)){ for(const e of d.entries){ const n=normalizeEntry(e); if(n) out.entries.push(n); } }
    if(d.settings && typeof d.settings==='object'){
      if(['sumi','ocher','spandrel','kinari'].includes(d.settings.theme)) out.settings.theme=d.settings.theme;
      if(['small','standard','large','xlarge'].includes(d.settings.fontSize)) out.settings.fontSize=d.settings.fontSize;
      if(FONTFAMS.some(f=>f.id===d.settings.fontFamily)) out.settings.fontFamily=d.settings.fontFamily;
      if(LINEHEIGHTS.some(l=>l.id===d.settings.lineHeight)) out.settings.lineHeight=d.settings.lineHeight;
    }
  }
  return out;
}
function loadDB(){
  try{ const raw=storeGet(LS_DATA); if(raw) return normalizeData(JSON.parse(raw)); }catch(e){}
  return normalizeData(null);
}
let DB = loadDB();
let LocalPhotos = {};   // entryId -> [dataUrl,...]（端末内のみ・同期JSONには含めない）
try{ const raw=storeGet(LS_PHOTOS); if(raw) LocalPhotos=JSON.parse(raw)||{}; }catch(e){ LocalPhotos={}; }

let saveWarned=false;
function saveDB(){
  if(!storeSet(LS_DATA, JSON.stringify(DB)) && !saveWarned){ saveWarned=true; alert('端末の保存容量がいっぱいで、保存できませんでした。写真を減らすか、Driveへ同期してください。'); }
}
function saveLocalPhotos(){
  if(!storeSet(LS_PHOTOS, JSON.stringify(LocalPhotos)) && !saveWarned){ saveWarned=true; alert('端末の保存容量がいっぱいで、写真を保存できませんでした。'); }
}
function visibleEntries(){ return DB.entries.filter(e=>!e.deleted); }
function entryById(id){ return DB.entries.find(e=>e.id===id) || null; }
function cmpDesc(a,b){
  if(a.date!==b.date) return a.date<b.date?1:-1;
  const ta=a.time||'99:99', tb=b.time||'99:99';
  if(ta!==tb) return ta<tb?1:-1;
  return b.createdAt-a.createdAt;
}
function cmpAsc(a,b){ return -cmpDesc(a,b); }

/* エントリ単位マージ：updatedAt が新しい方を採用、同点なら tombstone 優先。写真参照は和集合を保持。 */
function mergeData(local, remote){
  const map=new Map();
  const put=(e)=>{
    const cur=map.get(e.id);
    if(!cur){ map.set(e.id, e); return; }
    let winner;
    if(e.updatedAt>cur.updatedAt) winner=e;
    else if(e.updatedAt<cur.updatedAt) winner=cur;
    else winner = (e.deleted && !cur.deleted) ? e : cur;
    const loser = winner===e ? cur : e;
    winner = Object.assign({}, winner);
    winner.photoNames = Array.from(new Set([].concat(winner.photoNames||[], loser.photoNames||[])));
    winner.photoFileIds = Array.from(new Set([].concat(winner.photoFileIds||[], loser.photoFileIds||[])));
    map.set(e.id, winner);
  };
  (local.entries||[]).forEach(put);
  (remote.entries||[]).forEach(put);
  const merged = normalizeData({ version:1, entries:Array.from(map.values()), settings: local.settings });
  return merged;
}

/* ================= sheet / modal ================= */
function openSheet(html){ $('sheet').innerHTML=html; $('overlay').classList.add('open'); }
function closeSheet(){ $('overlay').classList.remove('open'); $('sheet').innerHTML=''; }
function sheetConfirm(title, msg, okLabel, danger){
  return new Promise((resolve)=>{
    openSheet('<h3>'+esc(title)+'</h3><div class="msg">'+esc(msg)+'</div>'+
      '<button class="sheetbtn '+(danger?'danger':'primary')+'" id="sh-ok">'+esc(okLabel)+'</button>'+
      '<button class="sheetbtn" id="sh-cancel">キャンセル</button>');
    $('sh-ok').onclick=()=>{ closeSheet(); resolve(true); };
    $('sh-cancel').onclick=()=>{ closeSheet(); resolve(false); };
  });
}
function sheetInfo(title, msg){
  return new Promise((resolve)=>{
    openSheet('<h3>'+esc(title)+'</h3><div class="msg">'+esc(msg)+'</div><button class="sheetbtn primary" id="sh-ok">閉じる</button>');
    $('sh-ok').onclick=()=>{ closeSheet(); resolve(); };
  });
}

/* ================= view switching ================= */
let currentView='list';
let prevView='list';
function showView(v){
  if(currentView==='entry' && v!=='entry' && editing){ saveEdit(); }
  if(v!=='settings' && typeof settingsPanel!=='undefined') settingsPanel=null;
  if(v!=='entry') prevView = (v==='search') ? prevView : v;
  currentView=v;
  ['list','calendar','search','entry','settings'].forEach(x=>{ $('view-'+x).classList.toggle('active', x===v); });
  ['list','calendar','settings'].forEach(x=>{ const b=$('nav-'+x); if(b) b.classList.toggle('on', x===v); });
  $('pillnav').style.display = (v==='entry') ? 'none' : 'flex';
  $('fab').style.display = (v==='list'||v==='calendar') ? 'flex' : 'none';
  if(v==='list') renderList();
  if(v==='calendar') renderCalendar();
  if(v==='settings') renderSettings();
  if(v==='search'){ renderSearch(); setTimeout(()=>{ try{$('searchinput').focus();}catch(e){} }, 60); }
  window.scrollTo(0,0);
}

/* ================= list ================= */
let selectedYear = (()=>{ const ys=visibleEntries().map(e=>+e.date.slice(0,4)); const y=new Date().getFullYear(); return ys.includes(y)?y:(ys.length?Math.max.apply(null,ys):y); })();
function openYearSheet(){
  const years=Array.from(new Set(visibleEntries().map(e=>+e.date.slice(0,4)))).sort((a,b)=>b-a);
  const cy=new Date().getFullYear(); if(!years.includes(cy)) years.unshift(cy);
  let html='<h3>年を選ぶ</h3>';
  years.forEach(y=>{ html+='<button class="yearitem'+(y===selectedYear?' on':'')+'" onclick="pickYear('+y+')">'+y+'年</button>'; });
  html+='<button class="sheetbtn" onclick="closeSheet()">閉じる</button>';
  openSheet(html);
}
function pickYear(y){ selectedYear=y; closeSheet(); renderList(); }
function entryCardHTML(e){
  const d=parseDateStr(e.date); const dow=d?DOW[d.getDay()]:'';
  const dowCls = d ? (d.getDay()===6?'sat':(d.getDay()===0?'sun':'')) : '';
  const title=firstLine(e.text)||'（タイトルなし）';
  const prev=restPreview(e.text);
  const nPhotos=(e.photoFileIds||[]).length + (LocalPhotos[e.id]?LocalPhotos[e.id].length:0) + (e.photoNames||[]).length;
  return '<button class="card" onclick="openEntry(\''+escA(e.id)+'\')">'+
    '<div class="when"><div class="dow '+dowCls+'">'+esc(dow)+'</div><div class="day">'+(d?d.getDate():'')+'</div><div class="time">'+esc(e.time||'')+'</div></div>'+
    '<div class="body"><div class="title">'+esc(title)+'</div>'+
    (prev?'<div class="preview">'+esc(prev)+'</div>':'')+
    (nPhotos?'<div class="photomark">▦ 写真 '+nPhotos+' 件</div>':'')+
    '</div></button>';
}
function renderList(){
  const es=visibleEntries().filter(e=>+e.date.slice(0,4)===selectedYear).sort(cmpDesc);
  if(!es.length){ $('listwrap').innerHTML='<div class="empty">'+selectedYear+'年の日記はまだありません。<br>右下の鉛筆から書けます。</div>'; return; }
  let html=''; let curMonth='';
  for(const e of es){
    const mk=e.date.slice(0,7);
    if(mk!==curMonth){ curMonth=mk; const d=parseDateStr(e.date); html+='<div class="monthhead">'+d.getFullYear()+'年'+(d.getMonth()+1)+'月</div>'; }
    html+=entryCardHTML(e);
  }
  $('listwrap').innerHTML=html;
}

/* ================= calendar ================= */
let calY=new Date().getFullYear(), calM=new Date().getMonth();
let selectedDate=todayStr();
function renderCalendar(){
  $('calmonth').textContent = calY+'年'+(calM+1)+'月';
  const first=new Date(calY, calM, 1);
  const startOffset=(first.getDay()+6)%7; /* 月曜始まり */
  const startDate=new Date(calY, calM, 1-startOffset);
  const have=new Set(visibleEntries().map(e=>e.date));
  let html=['月','火','水','木','金','土','日'].map((w,i)=>'<div class="dowh'+(i===5?' sat':(i===6?' sun':''))+'">'+w+'</div>').join('');
  for(let i=0;i<42;i++){
    const d=new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate()+i);
    const ds=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    const dow=(d.getDay()+6)%7; /* 0=月 .. 6=日 */
    const cls=['calcell'];
    if(d.getMonth()!==calM) cls.push('dim');
    if(dow===5) cls.push('sat'); if(dow===6) cls.push('sun');
    if(ds===todayStr()) cls.push('today');
    if(ds===selectedDate) cls.push('sel');
    if(have.has(ds)) cls.push('has');
    html+='<button class="'+cls.join(' ')+'" onclick="pickDate(\''+ds+'\')"><span class="tnum">'+d.getDate()+'</span></button>';
  }
  $('calgrid').innerHTML=html;
  const es=visibleEntries().filter(e=>e.date===selectedDate).sort(cmpDesc);
  $('caldaylist').innerHTML = '<div class="caldayhead">'+fmtDateLabel(selectedDate)+'</div>'+
    (es.length ? es.map(entryCardHTML).join('') : '<div class="empty">この日の日記はありません。</div>');
}
function pickDate(ds){
  selectedDate=ds;
  const d=parseDateStr(ds);
  if(d && (d.getFullYear()!==calY || d.getMonth()!==calM)){ calY=d.getFullYear(); calM=d.getMonth(); }
  renderCalendar();
}
function moveMonth(delta){
  calM+=delta;
  if(calM<0){ calM=11; calY--; } if(calM>11){ calM=0; calY++; }
  renderCalendar();
}
function goToday(){ const d=new Date(); calY=d.getFullYear(); calM=d.getMonth(); selectedDate=todayStr(); renderCalendar(); }
(function initSwipe(){
  let sx=0, sy=0, tracking=false;
  const grid=$('calgrid');
  grid.addEventListener('touchstart', (ev)=>{ if(ev.touches.length===1){ sx=ev.touches[0].clientX; sy=ev.touches[0].clientY; tracking=true; } }, {passive:true});
  grid.addEventListener('touchmove', (ev)=>{
    if(!tracking) return;
    const dx=ev.touches[0].clientX-sx, dy=ev.touches[0].clientY-sy;
    if(Math.abs(dx)>56 && Math.abs(dx)>Math.abs(dy)*1.6){ moveMonth(dx<0?1:-1); tracking=false; }
  }, {passive:true});
  grid.addEventListener('touchend', ()=>{ tracking=false; }, {passive:true});
})();

/* ================= search ================= */
let searchQuery='';
function onSearchInput(v){ searchQuery=v; renderSearch(); }
function renderSearch(){
  const q=searchQuery.trim();
  if(!q){ $('searchcount').textContent=''; $('searchresults').innerHTML='<div class="empty">タイトルと本文から探します。</div>'; return; }
  const es=visibleEntries().filter(e=>(e.text||'').includes(q)).sort(cmpDesc);
  $('searchcount').textContent = '「'+q+'」 '+es.length+' 件';
  $('searchresults').innerHTML = es.length ? es.map(entryCardHTML).join('') : '<div class="empty">見つかりませんでした。</div>';
}

/* ================= entry view ================= */
let currentEntryId=null;
let editing=false;
let currentIsNew=false;
function openEntry(id){
  if(currentView!=='entry') prevView=currentView;
  currentEntryId=id; currentIsNew=false; editing=false;
  showView('entry'); renderEntry();
}
function newEntry(){
  if(currentView!=='entry') prevView=currentView;
  const e=normalizeEntry({ id:genId(), date:todayStr(), time:nowTimeStr(), text:'', createdAt:Date.now(), updatedAt:Date.now() });
  DB.entries.push(e); saveDB();
  currentEntryId=e.id; currentIsNew=true;
  showView('entry'); editing=false; renderEntry(); toggleEdit(true);
}
function backFromEntry(){
  if(editing){ saveEdit(); }
  const e=entryById(currentEntryId);
  if(e && currentIsNew && !e.text.trim()){ e.deleted=true; e.updatedAt=Date.now(); saveDB(); scheduleSync(); }
  currentIsNew=false; currentEntryId=null;
  showView(prevView==='entry' ? 'list' : prevView);
}
function renderEntry(){
  const e=entryById(currentEntryId); if(!e){ showView('list'); return; }
  $('entrypill').textContent = fmtDateLabel(e.date) + (e.time ? '　'+e.time : '');
  $('entryeditbtn').textContent = editing ? '✓' : '✎';
  $('entryread').style.display = editing ? 'none' : 'block';
  $('entryedit').style.display = editing ? 'block' : 'none';
  if(editing){
    $('editdate').value=e.date; $('edittime').value=e.time||'';
    const ta=$('editarea'); if(ta.value!==e.text) ta.value=e.text;
  } else {
    const lines=String(e.text||'').split('\n');
    let hi=0; while(hi<lines.length && lines[hi].trim()==='') hi++;
    const title = hi<lines.length ? lines[hi] : '';
    const rest = lines.slice(hi+1).join('\n').replace(/^\n+/, '');
    let html='<div class="entrybody">';
    html+='<h1>'+(title?esc(title):'（タイトルなし）')+'</h1>';
    if(rest){
      html+=rest.split(/\n{2,}/).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('');
    }
    if((e.photoNames||[]).length){
      html+='<div class="photoline">移行元の写真： '+e.photoNames.map(esc).join('、')+'（実体は移行元にあります）</div>';
    }
    html+='</div>';
    $('entryread').innerHTML=html;
  }
  renderEntryPhotos();
}

function renderEntryPhotos(){

  const driveIds=e.photoFileIds||[];

    driveIds.forEach((fid)=>{ html+='<div class="phototile" id="ph-'+escA(fid)+'"><div class="loading">読み込み中…</div>'+(editing?'<button class="del" onclick="removeDrivePhoto(\''+escA(fid)+'\')">×</button>':'')+'</div>'; });
    html+='</div>';
  }
  html+='<button class="addphoto" onclick="document.getElementById(\'photofile\').click()">＋ 写真を追加</button>';
  if(!isDriveConnected()){
    html+='<div class="note">写真はこの端末内に保存されます（容量に注意）。Google Driveと接続すると、写真は Drive に保存されます。</div>';
  }
  $('entryphotos').innerHTML=html;
  driveIds.forEach((fid)=>{ loadDrivePhoto(fid); });
}
async function loadDrivePhoto(fid){
  const box=$('ph-'+CSS.escape(fid)); if(!box) return;
  if(drivePhotoCache[fid]){ box.innerHTML='<img src="'+drivePhotoCache[fid]+'" alt="写真">'+(editing?'<button class="del" onclick="removeDrivePhoto(\''+escA(fid)+'\')">×</button>':''); return; }
  const tok=getValidToken();
  if(!tok){ box.innerHTML='<div class="loading">Drive未接続のため表示できません</div>'; return; }
  try{
    const res=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fid)+'?alt=media', { headers:{ Authorization:'Bearer '+tok } });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const blob=await res.blob();
    const url=URL.createObjectURL(blob); drivePhotoCache[fid]=url;
    const b2=$('ph-'+CSS.escape(fid));
    if(b2) b2.innerHTML='<img src="'+url+'" alt="写真">'+(editing?'<button class="del" onclick="removeDrivePhoto(\''+escA(fid)+'\')">×</button>':'');
  }catch(err){
    if(box) box.innerHTML='<div class="loading">写真を読み込めませんでした</div>';
  }
}
function removeLocalPhoto(i){
  const e=entryById(currentEntryId); if(!e) return;
  const arr=LocalPhotos[e.id]||[]; arr.splice(i,1);
  if(arr.length) LocalPhotos[e.id]=arr; else delete LocalPhotos[e.id];
  saveLocalPhotos(); e.updatedAt=Date.now(); saveDB(); renderEntryPhotos(); scheduleSync();
}
function removeDrivePhoto(fid){
  const e=entryById(currentEntryId); if(!e) return;
  e.photoFileIds=(e.photoFileIds||[]).filter(x=>x!==fid);
  e.updatedAt=Date.now(); saveDB(); renderEntryPhotos(); scheduleSync();
}
function onPhotoFile(input){
  const file=input.files && input.files[0]; input.value='';
  const e=entryById(currentEntryId); if(!file || !e) return;
  processPhotoFile(file).then((dataUrl)=>{
    if(!LocalPhotos[e.id]) LocalPhotos[e.id]=[];
    LocalPhotos[e.id].push(dataUrl); saveLocalPhotos();
    e.updatedAt=Date.now(); saveDB(); renderEntryPhotos(); scheduleSync();
  }).catch(()=>{ sheetInfo('写真', '写真を読み込めませんでした。'); });
}
function processPhotoFile(file){
  return new Promise((resolve, reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        const max=1600; let w=img.naturalWidth, h=img.naturalHeight;
        const scale=Math.min(1, max/Math.max(w,h)); w=Math.round(w*scale); h=Math.round(h*scale);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL('image/jpeg', 0.82));
      }catch(err){ reject(err); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src=url;
  });
}

/* ================= Google Drive sync ================= */
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
const DRIVE_API='https://www.googleapis.com/drive/v3';
const UPLOAD_API='https://www.googleapis.com/upload/drive/v3';
let syncStatus='disconnected'; /* disconnected | syncing | synced | error */
let syncMsg='';
let lastSyncAt=0;
let syncTimer=null;
let syncRunning=false;

function getClientId(){ return (storeGet(LS_CID)||'').trim(); }
function getValidToken(){
  const tok=storeGet(SS_TOKEN);
  const exp=+(storeGet(LS_TOKEN_EXP)||0);
  if(tok && exp && Date.now()<exp-15000) return tok;
  return null;
}
function isDriveConnected(){ return !!getValidToken(); }
function storeToken(tok, expiresInSec){
  storeSet(SS_TOKEN, tok);
  storeSet(LS_TOKEN_EXP, String(Date.now() + (expiresInSec||3600)*1000));
  storeDel(LS_AUTH_ERR);
}
function clearToken(){
  storeDel(SS_TOKEN);
  storeDel(LS_TOKEN_EXP);
  storeDel(LS_AUTH_ERR);
}
function setSyncStatus(st, msg){
  syncStatus=st; if(typeof msg==='string') syncMsg=msg;
  renderSyncStatus();
}
function renderSyncStatus(){
  let label, cls='';
  if(syncStatus==='synced') label='同期済み'+(lastSyncAt ? '（'+pad2(new Date(lastSyncAt).getHours())+':'+pad2(new Date(lastSyncAt).getMinutes())+'）' : '');
  else if(syncStatus==='syncing') label='同期中…';
  else if(syncStatus==='error'){ label='同期エラー'+(syncMsg ? '：'+syncMsg : ''); cls='err'; }
  else label='Drive未接続（端末内に保存中）';
  const bar=$('syncbar'); if(bar) bar.innerHTML='<span class="'+cls+'">'+esc(label)+'</span>';
  const st=$('syncstat'); if(st) st.innerHTML='<span class="'+cls+'">'+esc(label)+'</span>';
}
function scheduleSync(){
  if(!isDriveConnected()) return;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{ syncNow('auto'); }, 1500);
}
function redirectUri(){ return location.origin + location.pathname; }

function connectDrive(){
  const cid=($('clientid') ? $('clientid').value.trim() : getClientId());
  if(!cid){ sheetInfo('Drive接続', '先に OAuth クライアントID を入力してください。'); return; }
  storeSet(LS_CID, cid);
  if(!(window.google && google.accounts && google.accounts.oauth2)){
    sheetInfo('Drive接続', 'Googleのライブラリを読み込めませんでした。通信環境を確認して、もう一度お試しください。'); return;
  }
  try{
    const tc=google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: DRIVE_SCOPE,
      ux_mode: 'popup',
      callback: function(resp){
        if(resp && resp.access_token){
          storeToken(resp.access_token, parseInt(resp.expires_in||'3600',10));
          storeDel(LS_PENDING);
          setSyncStatus('syncing');
          syncNow('connect');
        } else {
          setSyncStatus('error', 'トークンを取得できませんでした');
        }
      },
      error_callback: function(err){
        const t='認証エラー：'+((err && (err.type || err.message)) || 'unknown');
        storeSet(LS_AUTH_ERR, t);
        setSyncStatus('error', t);
        storeDel(LS_PENDING);
      }
    });
    storeSet(LS_PENDING, String(Date.now()));
    tc.requestAccessToken();
  }catch(e){
    sheetInfo('Drive接続', '接続を開始できませんでした：'+(e && e.message ? e.message : e));
  }
}
function disconnectDrive(){
  const tok=getValidToken();
  if(tok && window.google && google.accounts && google.accounts.oauth2){
    try{ google.accounts.oauth2.revoke(tok, function(){}); }catch(e){}
  }
  clearToken(); setSyncStatus('disconnected');
}
function checkAuthRedirect(){
  let handled=null;
  const hadPending=!!storeGet(LS_PENDING);
  if(location.hash && location.hash.indexOf('access_token')>=0){
    const p=new URLSearchParams(location.hash.slice(1));
    const tok=p.get('access_token');
    const exp=parseInt(p.get('expires_in')||'3600', 10);
    if(tok){ storeToken(tok, exp); storeDel(LS_PENDING); handled='token'; }
    try{ history.replaceState(null, '', location.pathname+location.search); }catch(e){}
  } else if(location.hash && location.hash.indexOf('error')>=0){
    const p=new URLSearchParams(location.hash.slice(1));
    const errTxt='認証エラー：'+(p.get('error')||'unknown')+((p.get('error_description')) ? '（'+p.get('error_description')+'）' : '');
    storeSet(LS_AUTH_ERR, errTxt);
    setSyncStatus('error', errTxt);
    storeDel(LS_PENDING);
    handled='error';
    try{ history.replaceState(null, '', location.pathname+location.search); }catch(e){}
  } else if(location.hash && location.hash.length>1){
    const noteTxt='認証の戻り（トークンなし）：'+location.hash.slice(0,120);
    storeSet(LS_AUTH_ERR, noteTxt);
    setSyncStatus('error', noteTxt);
    storeDel(LS_PENDING);
    handled='error';
    try{ history.replaceState(null, '', location.pathname+location.search); }catch(e){}
  }
  if(!handled && hadPending && !isDriveConnected()){
    const diagTxt='診断：接続ボタンは押されましたが、認証の戻り（URLの # 以降）が確認できませんでした';
    storeSet(LS_AUTH_ERR, diagTxt);
    setSyncStatus('error', diagTxt);
    storeDel(LS_PENDING);
    handled='error';
  }
  return handled;
}
function trySilentRefresh(){
  const cid=getClientId(); if(!cid) return;
  if(!(window.google && google.accounts && google.accounts.oauth2)) return;
  try{
    const tc=google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: DRIVE_SCOPE,
      ux_mode: 'popup',
      callback: function(resp){
        if(resp && resp.access_token){ storeToken(resp.access_token, parseInt(resp.expires_in||'3600',10)); setSyncStatus('synced'); syncNow('startup'); }
      },
      error_callback: function(){ if(syncStatus!=='error') setSyncStatus('disconnected'); }
    });
    tc.requestAccessToken({ prompt: '' });
  }catch(e){ setSyncStatus('disconnected'); }
}

async function driveFetch(path, opts){
  const tok=getValidToken(); if(!tok) throw new Error('no token');
  const res=await fetch(DRIVE_API+path, Object.assign({}, opts||{}, { headers: Object.assign({ Authorization:'Bearer '+tok }, (opts&&opts.headers)||{}) }));
  return res;
}
function dataURLtoBlob(dataUrl){
  const m=/^data:([^;,]+)?(;base64)?,(.*)$/.exec(dataUrl||'');
  if(!m) return new Blob([]);
  if(m[2]){ const bin=atob(m[3]); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr], { type:m[1]||'image/jpeg' }); }
  return new Blob([decodeURIComponent(m[3])], { type:m[1]||'image/jpeg' });
}
async function uploadPendingPhotos(){
  const tok=getValidToken(); if(!tok) return;
  for(const entryId of Object.keys(LocalPhotos)){
    const e=entryById(entryId); if(!e) continue;
    const arr=LocalPhotos[entryId]||[];
    const remaining=[];
    for(let i=0;i<arr.length;i++){
      try{
        const name='photo_'+entryId+'_'+((e.photoFileIds||[]).length+ (arr.length-remaining.length)) +'.jpg';
        const meta={ name:name, mimeType:'image/jpeg' };
        const form=new FormData();
        form.append('metadata', new Blob([JSON.stringify(meta)], { type:'application/json' }));
        form.append('file', dataURLtoBlob(arr[i]), name);
        const res=await fetch(UPLOAD_API+'/files?uploadType=multipart&fields=id', { method:'POST', headers:{ Authorization:'Bearer '+tok }, body: form });
        if(!res.ok) throw new Error('photo upload HTTP '+res.status);
        const j=await res.json();
        if(j && j.id){ e.photoFileIds=(e.photoFileIds||[]).concat([j.id]); e.updatedAt=Date.now(); }
        else remaining.push(arr[i]);
      }catch(err){ remaining.push(arr[i]); }
    }
    if(remaining.length) LocalPhotos[entryId]=remaining; else delete LocalPhotos[entryId];
  }
  saveLocalPhotos(); saveDB();
}
async function findDiaryFile(){
  const q=encodeURIComponent("name='diary.json' and trashed=false");
  const res=await driveFetch('/files?q='+q+'&fields='+encodeURIComponent('files(id,name,createdTime,headRevisionId)')+'&orderBy=createdTime');
  if(!res.ok) throw new Error('files.list HTTP '+res.status);
  const j=await res.json();
  const files=(j.files||[]).filter(f=>f.name==='diary.json');
  return files.length ? files[0] : null;
}
async function downloadDiary(fileId){
  const res=await driveFetch('/files/'+encodeURIComponent(fileId)+'?alt=media');
  if(!res.ok) throw new Error('download HTTP '+res.status);
  const text=await res.text();
  return normalizeData(JSON.parse(text));
}
async function getHeadRevision(fileId){
  const res=await driveFetch('/files/'+encodeURIComponent(fileId)+'?fields=headRevisionId');
  if(!res.ok) return null;
  const j=await res.json(); return j.headRevisionId||null;
}
async function uploadDiaryUpdate(fileId, data){
  const tok=getValidToken(); if(!tok) throw new Error('no token');
  const res=await fetch(UPLOAD_API+'/files/'+encodeURIComponent(fileId)+'?uploadType=media', {
    method:'PATCH',
    headers:{ Authorization:'Bearer '+tok, 'Content-Type':'application/json' },
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error('update HTTP '+res.status);
}
async function createDiary(data){
  const tok=getValidToken(); if(!tok) throw new Error('no token');
  const meta={ name:'diary.json', mimeType:'application/json' };
  const form=new FormData();
  form.append('metadata', new Blob([JSON.stringify(meta)], { type:'application/json' }));
  form.append('file', new Blob([JSON.stringify(data)], { type:'application/json' }), 'diary.json');
  const res=await fetch(UPLOAD_API+'/files?uploadType=multipart&fields=id', { method:'POST', headers:{ Authorization:'Bearer '+tok }, body: form });
  if(!res.ok) throw new Error('create HTTP '+res.status);
  return res.json();
}

async function syncNow(reason){
  if(syncRunning) return;
  const tok=getValidToken();
  if(!tok){ setSyncStatus(getClientId() ? 'disconnected' : 'disconnected', ''); return; }
  syncRunning=true; setSyncStatus('syncing');
  try{
    await uploadPendingPhotos();
    let file=await findDiaryFile();
    if(!file){
      await createDiary(DB);
    } else {
      let remote=await downloadDiary(file.id);
      let merged=mergeData(DB, remote);
      const rev=await getHeadRevision(file.id);
      if(rev && file.headRevisionId && rev!==file.headRevisionId){
        remote=await downloadDiary(file.id);
        merged=mergeData(DB, remote);
      }
      DB=merged; saveDB(); applyAppearance();
      await uploadDiaryUpdate(file.id, DB);
    }
    lastSyncAt=Date.now();
    setSyncStatus('synced');
    if(currentView==='list') renderList();
    if(currentView==='calendar') renderCalendar();
    if(currentView==='entry') renderEntry();
    if(currentView==='settings') renderSyncStatus();
  }catch(e){
    setSyncStatus('error', (e && e.message) ? e.message : String(e));
  }finally{
    syncRunning=false;
  }
}

/* ================= init ================= */
(function init(){
  applyAppearance();
  const authResult=checkAuthRedirect();
  renderList(); renderCalendar(); renderSyncStatus();
  if(authResult==='token'){
    setSyncStatus('syncing');
    setTimeout(()=>syncNow('connect'), 300);
  } else if(authResult==='error'){
    /* 認証エラーを表示したままにする（サイレント更新で上書きしない） */
  } else if(isDriveConnected()){
    setTimeout(()=>syncNow('startup'), 300);
  } else if(getClientId() && storeGet(LS_AUTH_ERR)){
    setSyncStatus('error', storeGet(LS_AUTH_ERR));
  } else if(getClientId()){
    setTimeout(trySilentRefresh, 800);
  }
})();
</script>
