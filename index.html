<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="1.40">
<title>日記</title>
<meta name="application-name" content="日記">
<meta name="apple-mobile-web-app-title" content="日記">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-diary3.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="IMG_2390.png">
<link rel="icon" type="image/png" href="icon-diary3.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Old+Mincho:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;500&family=Zen+Kurenaido&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    --fs: 16px;
    --uifont: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg); color: var(--text);
    font-size: var(--fs); line-height: var(--lh, 1.7);
    padding-bottom: 108px;
    -webkit-text-size-adjust: 100%;
  }
  body[data-fontfamily="mincho"] { font-family: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "YuMincho", "Yu Mincho", "Noto Serif JP", serif; }
  body[data-fontfamily="gothic"] { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body[data-fontsize="small"]  { --fs: 14px; }
  body[data-fontsize="standard"] { --fs: 16px; }
  body[data-fontsize="large"]  { --fs: 18px; }
  body[data-fontsize="xlarge"] { --fs: 20px; }

  body[data-theme="sumi"] {
    --bg:#000000; --bg2:#101012; --card:#26262b; --card2:#33333a;
    --text:#f4f4f6; --muted:#9c9ca4; --accent:#d9d9e0; --line:#33333a;
    --danger:#ff453a; --sat:#5e9bff; --sun:#ff6b61; --nav:rgba(26,26,30,.92);
    --sheet:rgba(0,0,0,.55); --fab:#a9a9b0; --fabink:#ffffff; --tag:#4da3ff;
  }
  body[data-theme="ocher"] {
    --bg:#16110b; --bg2:#1d1610; --card:#251c12; --card2:#2f2416;
    --text:#f4ecdc; --muted:#b3a58c; --accent:#d9a441; --line:#3a2d1c;
    --danger:#ff5a47; --sat:#6ea8d8; --sun:#e07856; --nav:rgba(33,25,16,.94);
    --sheet:rgba(0,0,0,.55); --fab:#d9a441; --fabink:#16110b; --tag:#64a8e8;
  }
  body[data-theme="spandrel"] {
    --bg:#0e100e; --bg2:#141713; --card:#191d18; --card2:#22271f;
    --text:#eef0e4; --muted:#a3ab97; --accent:#c9cfae; --line:#2c332a;
    --danger:#ff5a47; --sat:#7ba7c9; --sun:#d98a7a; --nav:rgba(22,26,21,.94);
    --sheet:rgba(0,0,0,.55); --fab:#c9cfae; --fabink:#0e100e; --tag:#7fb0dd;
  }
  body[data-theme="kinari"] {
    --bg:#f1ebda; --bg2:#eae2cd; --card:#faf6ea; --card2:#f3eddb;
    --text:#211d14; --muted:#7a7261; --accent:#57503e; --line:#ddd2b8;
    --danger:#c23b2e; --sat:#2f6fb2; --sun:#c23b2e; --nav:rgba(250,246,234,.95);
    --sheet:rgba(60,52,32,.35); --fab:#57503e; --fabink:#f1ebda; --tag:#1f5fc4;
  }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  /* UIの文字は常にゴシック体（本文とカードのタイトル／プレビューだけ選択フォント） */
  #syncbar, .searchbar input, .searchcount, .empty, .taglabel, .tagchip, .tagnote, .tagclear,
  .card .when, .card .tagline, .card .photomark,
  .datepill, .photoline, .editmeta label,
  .sheet h3, .sheet .msg, .sheetbtn, .yearitem,
  .srow, .pillrow, .panelnav, .setlabel, .note, .syncstat, .seg, .btn, .textin,
  .setgroup > h2, .caldayhead, .addphoto {
    font-family: var(--uifont);
  }
  .tagnote { color: var(--muted); font-size: calc(var(--fs) * .85); margin: 0 4px; }
  input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--accent); }

  /* ---------- top bar ---------- */
  .uifont { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 6px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
    background: var(--bg);
  }
  .topbar .ttl { flex: 1; text-align: center; font-size: calc(var(--fs) * 1.12); letter-spacing: .08em; font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .iconbtn { min-width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; font-size: calc(var(--fs) * 1.05); color: var(--text); border-radius: 12px; }
  .iconbtn:active { background: var(--card); }
  .roundbtn {
    width: 46px; height: 46px; flex: none; border-radius: 50%;
    background: var(--card); border: 1px solid var(--line);
    display: inline-flex; align-items: center; justify-content: center; color: var(--text);
  }
  .roundbtn:active { background: var(--card2); }
  .roundbtn svg { width: 23px; height: 23px; }
  .spacer44 { width: 44px; flex: none; }

  #syncbar { text-align: center; font-size: calc(var(--fs) * .72); color: var(--muted); padding: 0 16px 6px; min-height: 1.2em; }
  #syncbar .err { color: var(--danger); }

  main { max-width: 720px; margin: 0 auto; padding: 0 14px; }
  .view { display: none; min-height: calc(100dvh + 2px); }
  .view.active { display: block; animation: viewin .18s ease-out; }
  @keyframes viewin { from { opacity: 0; } }

  /* ---------- splash (opening) ---------- */
  #splash { position: fixed; inset: 0; z-index: 200; background: var(--bg); transition: opacity .45s ease; }
  #splash.hide { opacity: 0; pointer-events: none; }

  /* ---------- entry cards ---------- */
  .monthhead { margin: 20px 2px 12px; font-size: calc(var(--fs) * 1.08); color: var(--text); font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .monthhead:first-child { margin-top: 4px; }
  .cardwrap { position: relative; margin-bottom: 12px; }
  .carddel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 84px;
    background: #cf534e; color: #fff; border-radius: 14px;
    font-size: calc(var(--fs) * .95); letter-spacing: .12em;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    position: relative; overflow: hidden; z-index: 1;
    display: flex; gap: 16px; width: 100%; text-align: left; align-items: stretch;
    background: var(--card); border: none; border-radius: 14px;
    padding: 16px; margin-bottom: 0; min-height: 106px;
    touch-action: pan-y; will-change: transform;
    transition: transform .3s cubic-bezier(.25,.9,.3,1);
  }
  .card:active { background: var(--card2); }
  body[data-theme="spandrel"] .card::after {
    content: ""; position: absolute; top: -19px; right: -19px; width: 36px; height: 36px;
    border: 1.5px solid var(--accent); border-radius: 50%; opacity: .55; pointer-events: none;
  }
  .card .when { flex: none; width: 54px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; font-family: var(--uifont); }
  .card .when .dow { font-size: calc(var(--fs) * .75); font-family: var(--uifont); }
  .card .when .dow.sat { color: var(--sat); } .card .when .dow.sun { color: var(--sun); }
  .card .when .day { font-size: calc(var(--fs) * 1.9); line-height: 1.3; font-weight: 600; color: #d9d9de; font-family: var(--uifont); }
  body[data-theme="kinari"] .card .when .day { color: var(--text); }
  .card .when .time { font-size: calc(var(--fs) * .78); margin-top: auto; font-family: var(--uifont); }
  .card .body { flex: 1; min-width: 0; }
  .card .title { font-size: calc(var(--fs) * 1.25); line-height: 1.5; font-weight: 600; word-break: break-word; }
  .card .preview { margin-top: 4px; font-size: calc(var(--fs) * .85); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .card .photomark { margin-top: 6px; font-size: calc(var(--fs) * .72); color: var(--muted); }
  .card .tagline { margin-top: 6px; font-size: calc(var(--fs) * .78); color: var(--tag); }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; font-size: calc(var(--fs) * .9); }

  /* ---------- FAB / pill nav ---------- */
  #fab {
    position: fixed; right: 18px; bottom: 85px; z-index: 40;
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--fab); color: var(--fabink);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 22px rgba(0,0,0,.45);
  }
  #fab svg { width: 28px; height: 28px; }
  #fab:active { transform: scale(.96); }
  #pillnav {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 40;
    bottom: 15px;
    width: calc(100vw - 92px); max-width: 430px; height: 56px;
    display: flex; gap: 0; padding: 5px; box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--nav);
    background: color-mix(in srgb, var(--nav) 55%, transparent);
    border: 1px solid var(--line);
    border: 1px solid color-mix(in srgb, var(--text) 13%, transparent);
    border-radius: 999px;
    backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5);
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.10), inset 0 -8px 16px rgba(255,255,255,.03);
  }
  #navind {
    position: absolute; top: 5px; bottom: 5px; left: 0; width: 0; border-radius: 999px; pointer-events: none;
    transform-origin: center;
    background: var(--card2);
    background: linear-gradient(180deg, color-mix(in srgb, var(--text) 21%, transparent), color-mix(in srgb, var(--text) 8%, transparent) 58%, color-mix(in srgb, var(--text) 13%, transparent));
    border: 1px solid color-mix(in srgb, var(--text) 16%, transparent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -6px 10px rgba(255,255,255,.05), 0 2px 10px rgba(0,0,0,.20);
    will-change: transform;
    transition: transform .45s cubic-bezier(.25,1,.3,1), width .45s cubic-bezier(.25,1,.3,1);
  }
  #pillnav button { position: relative; z-index: 1; flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; border-radius: 999px; font-size: 10px; font-weight: 500; color: var(--muted); white-space: nowrap; transition: color .3s; }
  #pillnav button svg { width: 21px; height: 21px; }
  #pillnav button.on { color: var(--text); }
  /* press feedback: subtle brighten while pressed, so taps are visible */
  button:active, .calcell:active { filter: brightness(1.32); }

  /* ---------- todo ---------- */
  .tdfolders { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
  .tdfolders::-webkit-scrollbar { display: none; }
  .tdfpill { flex: 0 0 auto; padding: 8px 15px; border-radius: 999px; background: var(--card); color: var(--muted); font-size: 14px; font-weight: 600; font-family: var(--uifont); }
  .tdfpill.on { background: var(--text); color: var(--bg); }
  .tdfpill .tdcnt { opacity: .65; font-weight: 500; margin-left: 3px; }
  .tdfpill.add { padding: 8px 13px; }
  .tdsub { display: flex; align-items: center; justify-content: space-between; min-height: 34px; padding: 0 2px 4px; }
  .tdsub button { color: var(--muted); font-size: 13.5px; font-family: var(--uifont); padding: 6px 8px; }
  .tdsub .tdsubR { display: flex; gap: 2px; }
  .tdlistrow { display: flex; align-items: center; width: 100%; padding: 17px 4px; border-bottom: 1px solid var(--line); font-size: 16px; color: var(--text); text-align: left; font-family: var(--uifont); }
  .tdlistrow .nm { flex: 1; }
  .tdlistrow .tdcnt { color: var(--muted); font-size: 15px; margin-right: 10px; }
  .tdlistrow .chev { color: var(--muted); font-size: 18px; }
  .tdrow { display: flex; align-items: center; gap: 12px; padding: 11px 4px 0; background: var(--bg); }
  .tdcheck { flex: 0 0 auto; width: 25px; height: 25px; border-radius: 50%; border: 2px solid var(--muted); color: var(--bg); font-size: 13px; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; background: transparent; }
  .tdcheck.done { background: var(--text); border-color: var(--text); }
  .tdmain { flex: 1; min-width: 0; padding-bottom: 11px; border-bottom: 1px solid var(--line); }
  .tdtitle { font-size: 15.5px; }
  .tdtitle.done { color: var(--muted); text-decoration: line-through; }
  .tddue { display: inline-block; margin-top: 2px; font-size: 11.5px; color: var(--muted); font-family: var(--uifont); }
  .tddue.over { color: #e5484d; }
  .tdhandle { flex: 0 0 auto; color: var(--muted); font-size: 17px; padding: 6px 8px; cursor: grab; touch-action: none; }
  .tdrow.dragging { position: relative; z-index: 5; background: var(--card2); border-radius: 10px; }
  .tdnone { color: var(--muted); text-align: center; padding: 52px 0; font-size: 14px; }
  .tdbackbar { display: flex; align-items: center; gap: 6px; padding: 2px 0 6px; }
  .tdback { font-size: 24px; color: var(--text); padding: 2px 10px 2px 2px; line-height: 1; }
  .tdltitle { flex: 1; font-size: 16px; font-weight: 700; font-family: var(--uifont); text-align: center; }
  .tdiconbtn { color: var(--text); padding: 6px; display: flex; }
  .tdiconbtn svg { width: 21px; height: 21px; }
  .tdedithead { display: flex; align-items: center; gap: 10px; padding: 0 0 4px; }
  .tdedithead .x { font-size: 17px; color: var(--text); padding: 6px 10px 6px 2px; }
  .tdedithead .t { font-size: 16px; font-weight: 700; font-family: var(--uifont); }
  .tdfab { position: fixed; bottom: 96px; z-index: 35; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .tdfab.plus { right: 18px; background: var(--text); color: var(--bg); font-size: 26px; font-weight: 300; }
  .tdfab.trash { left: 18px; background: var(--card2); color: var(--muted); }
  .tdfab svg { width: 22px; height: 22px; }
  .tdfab.undo { left: 82px; background: var(--card2); color: var(--text); }
  .tddonehead { font-family: var(--uifont); font-size: 13px; color: var(--muted); margin: 22px 4px 0; letter-spacing: .05em; }
  .tdeditbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 35; display: flex; align-items: center; gap: 4px; background: var(--card2); border-radius: 999px; padding: 7px 10px; box-shadow: 0 8px 22px rgba(0,0,0,.4); }
  .tdeditbar button { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text); }
  .tdeditbar button.off { opacity: .35; }
  .tdeditbar button svg { width: 20px; height: 20px; }
  .tdeditbar .tddelbtn { color: #e5484d; }
  /* todo full-screen form overlay */
  #tdoverlay { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.45); display: none; flex-direction: column; }
  #tdsheet { background: var(--bg2); border-radius: 24px 24px 0 0; margin-top: calc(env(safe-area-inset-top, 0px) + 4px); overflow: hidden; }
  #tdoverlay.open { display: flex; }
  #tdsheet { transform: translateY(103%); transition: transform .37s cubic-bezier(.32,.72,.28,1); }
  #tdoverlay.show #tdsheet { transform: translateY(0); }
  .tdfhead { display: flex; align-items: center; padding: 26px 14px 10px; }
  .tdfx { width: 40px; height: 40px; border-radius: 50%; background: var(--card2); color: var(--text); font-size: 17px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .tdfttl { flex: 1; text-align: center; font-size: 16px; font-weight: 700; font-family: var(--uifont); }
  .tdfok { width: 40px; height: 40px; border-radius: 50%; background: var(--text); color: var(--bg); font-size: 17px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .tdfbody { flex: 1; overflow-y: auto; padding: 26px 16px calc(env(safe-area-inset-bottom, 0px) + 24px); }
  .tdfinput { width: 100%; box-sizing: border-box; background: var(--card); border: none; border-radius: 999px; color: var(--text); font-size: 16px; padding: 14px 16px; font-family: var(--uifont); }
  .tdfinput::placeholder { color: var(--muted); }
  textarea.tdfinput { min-height: 180px; resize: vertical; line-height: 1.7; border-radius: 18px; }
  .tdfinput:focus { outline: none; }
  .tdfcard { background: var(--card); border-radius: 16px; margin-top: 16px; overflow: hidden; }
  .tdfopt { display: flex; align-items: center; width: 100%; padding: 15px 16px; font-size: 15px; color: var(--text); text-align: left; border-bottom: 1px solid var(--line); font-family: var(--uifont); }
  .tdfopt:last-child { border-bottom: none; }
  .tdfopt .lb { flex: 1; }
  .tdfopt .vl { color: var(--muted); margin-right: 8px; }
  .tdfopt .chev { color: var(--muted); }
  .tdfopt .chk { color: var(--text); font-weight: 700; }
  .tdfnote { color: var(--muted); font-size: 12px; margin-top: 10px; line-height: 1.6; }
  .tdfsub { color: var(--muted); font-size: 12.5px; display: block; margin-top: 2px; }
  .tdseg { display: flex; background: var(--card); border-radius: 12px; padding: 3px; margin-top: 16px; }
  .tdseg button { flex: 1; padding: 9px 0; border-radius: 9px; color: var(--muted); font-size: 14px; font-family: var(--uifont); }
  .tdseg button.on { background: var(--card2); color: var(--text); font-weight: 600; }
  .tdcolors { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .tdcolor { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
  .tdcolor.on { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg2), 0 0 0 4px var(--text); }
  .tdflabel { font-size: 13px; color: var(--muted); font-family: var(--uifont); margin: 18px 0 8px; }
  .tdadminrow { display: flex; align-items: center; gap: 10px; padding: 13px 4px; border-bottom: 1px solid var(--line); background: var(--bg2); }
  .tdminus { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: #e5484d; color: #fff; font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; }
  .tdadminrow .nm { flex: 1; font-size: 15.5px; text-align: left; color: var(--text); }
  .tdmenuitem { display: block; width: 100%; text-align: left; padding: 13px 6px; font-size: 15px; color: var(--text); border-bottom: 1px solid var(--line); font-family: var(--uifont); }
  .tdmenuitem:last-child { border-bottom: none; }
  .tdmenuitem.danger { color: #e5484d; }
  .tdmenuitem .chev { float: right; color: var(--muted); }
  /* v1.22: ui copy round 2 */
  #view-todo, #tdoverlay, #tddrawer, #tdpop, #tdmodal { font-family: var(--uifont); }
  .tdfinput { font-family: var(--uifont); }
  #view-todo .topbar .tdiconbtn { width: 42px; height: 42px; border-radius: 50%; background: var(--card2); align-items: center; justify-content: center; }
  #view-todo.td-sub .topbar { display: none; }
  #view-todo.td-sub .tdbackbar, #view-todo.td-sub .tdedithead { padding-top: calc(env(safe-area-inset-top, 0px) + 10px); }
  .tdfpill { font-size: 15px; }
  .tdlistrow { font-size: 17px; padding: 18px 4px; }
  .tdlistrow .tdcnt { font-size: 16px; }
  .tdtitle { font-size: 16.5px; }
  .tdrow { padding-top: 13px; }
  .tdmain { padding-bottom: 13px; }
  .tdsub button { font-size: 14px; display: inline-flex; align-items: center; gap: 5px; }
  .tdsub button svg { width: 19px; height: 19px; flex: 0 0 auto; }
  .tdghost { position: absolute; inset: 0; background: var(--bg); overflow: hidden; z-index: 2; }
  .tdpagenew { position: absolute; inset: 0; background: var(--bg); overflow: hidden; z-index: 3; }
  #todowrap { position: relative; }
  #view-todo { padding-bottom: 76px; }
  /* drawer */
  #tddrawer { position: fixed; inset: 0; z-index: 60; display: none; }
  #tddrawer.open { display: block; }
  #tddrawer .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); opacity: 0; transition: opacity .28s; }

function fontFamById(id){ return FONTFAMS.find(f=>f.id===id) || FONTFAMS[0]; }

function ensureFontLoaded(f){
  if(!f || !f.gf || loadedFonts[f.id]) return;

  l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(f.gf).replace(/%20/g,'+')+':wght@'+f.w+'&display=swap';

function defaultSettings(){ return { theme:'sumi', fontSize:'standard', fontFamily:'mincho', lineHeight:'standard' }; }
function normalizeEntry(e){
  if(!e || typeof e!=='object') return null;
  const id = (typeof e.id==='string' && e.id) ? e.id : genId();
  return {
    id: id,
    date: (typeof e.date==='string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date)) ? e.date : todayStr(),
    time: (typeof e.time==='string' && e.time) ? e.time : null,
    text: typeof e.text==='string' ? e.text : '',
    photoNames: Array.isArray(e.photoNames) ? e.photoNames.filter(x=>typeof x==='string') : [],
    photoFileIds: Array.isArray(e.photoFileIds) ? e.photoFileIds.filter(x=>typeof x==='string') : [],
    createdAt: typeof e.createdAt==='number' ? e.createdAt : Date.now(),
    updatedAt: typeof e.updatedAt==='number' ? e.updatedAt : Date.now(),
    deleted: e.deleted===true
  };
}
function normalizeData(d){
  const out = { version:1, entries:[], settings: defaultSettings() };
  if(d && typeof d==='object'){
    if(Array.isArray(d.entries)){ for(const e of d.entries){ const n=normalizeEntry(e); if(n) out.entries.push(n); } }
    if(d.settings && typeof d.settings==='object'){
      if(['sumi','ocher','spandrel','kinari'].includes(d.settings.theme)) out.settings.theme=d.settings.theme;
      if(['small','standard','large','xlarge'].includes(d.settings.fontSize)) out.settings.fontSize=d.settings.fontSize;
      if(FONTFAMS.some(f=>f.id===d.settings.fontFamily)) out.settings.fontFamily=d.settings.fontFamily;
      if(LINEHEIGHTS.some(l=>l.id===d.settings.lineHeight)) out.settings.lineHeight=d.settings.lineHeight;
    }
  }
  return out;
}

    if(e.updatedAt>cur.updatedAt) winner=e;
    else if(e.updatedAt<cur.updatedAt) winner=cur;
    else winner = (e.deleted && !cur.deleted) ? e : cur;
    const loser = winner===e ? cur : e;
    winner = Object.assign({}, winner);
    winner.photoNames = Array.from(new Set([].concat(winner.photoNames||[], loser.photoNames||[])));
    winner.photoFileIds = Array.from(new Set([].concat(winner.photoFileIds||[], loser.photoFileIds||[])));
    map.set(e.id, winner);
  };
  (local.entries||[]).forEach(put);
  (remote.entries||[]).forEach(put);
  const merged = normalizeData({ version:1, entries:Array.from(map.values()), settings: local.settings });
  return merged;
}

  nav.style.bottom='15px';
  const gap=window.innerHeight - nav.getBoundingClientRect().bottom;
  if(Math.abs(gap-15)>2) nav.style.bottom=(30-gap)+'px';

let calY=new Date().getFullYear(), calM=new Date().getMonth();

function calGridHTML(y, m){
  const first=new Date(y, m, 1);
  const startOffset=(first.getDay()+6)%7; /* 月曜始まり */
  const startDate=new Date(y, m, 1-startOffset);
  const have=new Set(visibleEntries().map(e=>e.date));

  for(let i=0;i<42;i++){
    const d=new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate()+i);
    const ds=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    const dow=(d.getDay()+6)%7; /* 0=月 .. 6=日 */
    const cls=['calcell'];
    if(d.getMonth()!==m) cls.push('dim');
    if(dow===5) cls.push('sat'); if(dow===6) cls.push('sun');
    if(ds===todayStr()) cls.push('today');

    html+='<button class="'+cls.join(' ')+'" onclick="pickDate(\''+ds+'\')"><span class="tnum">'+d.getDate()+'</span></button>';
  }

function calWrapW(){ const w=$('calwrap'); return w ? w.clientWidth : 0; }
function calTrackReset(){
  const tr=$('caltrack'); if(!tr) return;
  tr.classList.remove('anim');
  tr.style.transform='translateX('+(-calWrapW())+'px)';
}
function renderCalendar(){
  $('calmonth').textContent = calY+'年'+(calM+1)+'月';

  $('calprev').innerHTML=calGridHTML(pm.getFullYear(), pm.getMonth());
  $('calgrid').innerHTML=calGridHTML(calY, calM);

let calAnim=null; /* 進行中の月スライド {delta} */
let calSuppressClickUntil=0;
function shiftMonth(delta){ calM+=delta; if(calM<0){ calM=11; calY--; } if(calM>11){ calM=0; calY++; } }
function settleMonth(delta){
  /* delta: 1=翌月へ / -1=前月へ / 0=元の月へ戻る。今の位置からアニメーションで確定位置まで滑らせる */
  if(calAnim) return;
  const tr=$('caltrack'); const W=calWrapW();
  if(!tr || !W){ if(delta){ shiftMonth(delta); renderCalendar(); } return; }
  calAnim={delta:delta};
  tr.classList.add('anim');
  tr.style.transform='translateX('+(-(1+delta)*W)+'px)';
  setTimeout(finishMonthSlide, 380);
}
function finishMonthSlide(){
  if(!calAnim) return;
  const delta=calAnim.delta; calAnim=null;
  if(delta) shiftMonth(delta);
  renderCalendar();
}
function pickDate(ds){
  if(calAnim) return;
  if(Date.now()<calSuppressClickUntil) return;
  selectedDate=ds;
  const d=parseDateStr(ds);
  if(d && (d.getFullYear()!==calY || d.getMonth()!==calM)){
    const diff=(d.getFullYear()-calY)*12+(d.getMonth()-calM);
    if(diff===1 || diff===-1){ settleMonth(diff); return; }
    calY=d.getFullYear(); calM=d.getMonth();
  }
  renderCalendar();
}
function moveMonth(delta){ settleMonth(delta); }
function goToday(){ const d=new Date(); calY=d.getFullYear(); calM=d.getMonth(); selectedDate=todayStr(); renderCalendar(); }
(function initCalSwipe(){
  let sx=0, sy=0, tracking=false, lock=null, dxCur=0;
  const wrap=$('calwrap'); const tr=$('caltrack');
  wrap.addEventListener('touchstart', (ev)=>{ if(ev.touches.length===1 && !calAnim){ sx=ev.touches[0].clientX; sy=ev.touches[0].clientY; tracking=true; lock=null; dxCur=0; } }, {passive:true});
  wrap.addEventListener('touchmove', (ev)=>{
    if(!tracking) return;
    const dx=ev.touches[0].clientX-sx, dy=ev.touches[0].clientY-sy;
    if(!lock){ if(Math.abs(dx)>8 && Math.abs(dx)>Math.abs(dy)*1.15) lock='h'; else if(Math.abs(dy)>8) lock='v'; }
    if(lock==='h'){
      const W=calWrapW(); dxCur=Math.max(-W, Math.min(W, dx));
      tr.classList.remove('anim');
      tr.style.transform='translateX('+(-W+dxCur)+'px)';
    }
  }, {passive:true});
  const end=()=>{
    if(!tracking) return; tracking=false;
    if(lock==='h'){
      calSuppressClickUntil=Date.now()+400;
      if(dxCur<=-56) settleMonth(1);
      else if(dxCur>=56) settleMonth(-1);
      else settleMonth(0);
    }
    lock=null;
  };
  wrap.addEventListener('touchend', end, {passive:true});
  wrap.addEventListener('touchcancel', end, {passive:true});
})();

const CARD_SWIPE_W=88;
let openSwipeCard=null;
let cardSuppressClickUntil=0;
function closeSwipeCard(el){

  c.style.transition=''; c.style.transform='translateX(0px)'; c.dataset.open='';

(function initCardSwipe(){
  let t=null;
  document.addEventListener('touchstart', (ev)=>{
    if(ev.target.closest && ev.target.closest('.carddel')){ t=null; return; }
    const card=ev.target.closest ? ev.target.closest('.card') : null;
    if(openSwipeCard && openSwipeCard!==card) closeSwipeCard();
    if(!card || ev.touches.length!==1){ t=null; return; }
    t={ el:card, x0:ev.touches[0].clientX, y0:ev.touches[0].clientY, base:(card.dataset.open==='1'?-CARD_SWIPE_W:0), lock:null, dx:0 };
  }, {passive:true});
  document.addEventListener('touchmove', (ev)=>{
    if(!t) return;
    const dx=ev.touches[0].clientX-t.x0, dy=ev.touches[0].clientY-t.y0;
    if(!t.lock){ if(Math.abs(dx)>8 && Math.abs(dx)>Math.abs(dy)*1.15) t.lock='h'; else if(Math.abs(dy)>8) t.lock='v'; }
    if(t.lock==='h'){
      t.dx=Math.max(-CARD_SWIPE_W, Math.min(0, t.base+dx));
      t.el.style.transition='none';
      t.el.style.transform='translateX('+t.dx+'px)';
    }
  }, {passive:true});
  const end=()=>{
    if(!t) return;
    if(t.lock==='h'){
      cardSuppressClickUntil=Date.now()+400;
      t.el.style.transition='';
      if(t.dx<=-40){ t.el.style.transform='translateX('+(-CARD_SWIPE_W)+'px)'; t.el.dataset.open='1'; openSwipeCard=t.el; }
      else closeSwipeCard(t.el);
    }
    t=null;
  };
  document.addEventListener('touchend', end, {passive:true});
  document.addEventListener('touchcancel', end, {passive:true});
  document.addEventListener('click', (ev)=>{
    const card=ev.target.closest ? ev.target.closest('.card') : null;
    if(!card) return;
    if(Date.now()<cardSuppressClickUntil){ ev.stopPropagation(); ev.preventDefault(); return; }
    if(card.dataset.open==='1'){ closeSwipeCard(card); ev.stopPropagation(); ev.preventDefault(); }
  }, true);
})();

const TAG_RE = /[#＃]([^\s#＃、。，．！？!?,.;:・「」『』（）()[\]{}<>＜＞"“”'‘’/\\|｜]+)/g;
function entryTags(e){
  const out=[]; const seen=new Set();
  const re=new RegExp(TAG_RE.source, 'g');
  let m; const text=e.text||'';
  while((m=re.exec(text))){ const t=m[1]; if(t && !seen.has(t)){ seen.add(t); out.push(t); } }
  return out;
}
function allTags(){
  const map=new Map();
  visibleEntries().forEach(e=>{ entryTags(e).forEach(t=>map.set(t, (map.get(t)||0)+1)); });
  return Array.from(map.entries()).sort((a,b)=> (b[1]-a[1]) || (a[0]<b[0]?-1:1));
}
function tagChipHTML(t, cnt){
  return '<button class="tagchip" onclick="openTag(\''+escA(t)+'\')">#'+esc(t)+(cnt!=null?'<span class="cnt">'+cnt+'</span>':'')+'</button>';
}
function linkifyTags(escapedHtml){
  return escapedHtml.replace(new RegExp(TAG_RE.source, 'g'), (m,t)=>'<button class="taglink" onclick="openTag(\''+escA(t)+'\')">#'+esc(t)+'</button>');
}

    html+='<div class="photogrid">';
    local.forEach((url,i)=>{ html+='<div class="phototile"><img src="'+url+'" alt="写真">'+(editing?'<button class="del" onclick="removeLocalPhoto('+i+')">×</button>':'')+'</div>'; });
    driveIds.forEach((fid)=>{ html+='<div class="phototile" id="ph-'+escA(fid)+'"><div class="loading">読み込み中…</div>'+(editing?'<button class="del" onclick="removeDrivePhoto(\''+escA(fid)+'\')">×</button>':'')+'</div>'; });
    html+='</div>';
  }
  html+='<button class="addphoto" onclick="document.getElementById(\'photofile\').click()">＋ 写真を追加</button>';
  if(!isDriveConnected()){
    html+='<div class="note">写真はこの端末内に保存されます（容量に注意）。Google Driveと接続すると、写真は Drive に保存されます。</div>';
  }
  $('entryphotos').innerHTML=html;
  driveIds.forEach((fid)=>{ loadDrivePhoto(fid); });
}
async function loadDrivePhoto(fid){
  const box=$('ph-'+CSS.escape(fid)); if(!box) return;
  if(drivePhotoCache[fid]){ box.innerHTML='<img src="'+drivePhotoCache[fid]+'" alt="写真">'+(editing?'<button class="del" onclick="removeDrivePhoto(\''+escA(fid)+'\')">×</button>':''); return; }
  const tok=getValidToken();
  if(!tok){ box.innerHTML='<div class="loading">Drive未接続のため表示できません</div>'; return; }
  try{
    const res=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fid)+'?alt=media', { headers:{ Authorization:'Bearer '+tok } });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const blob=await res.blob();
    const url=URL.createObjectURL(blob); drivePhotoCache[fid]=url;
    const b2=$('ph-'+CSS.escape(fid));
    if(b2) b2.innerHTML='<img src="'+url+'" alt="写真">'+(editing?'<button class="del" onclick="removeDrivePhoto(\''+escA(fid)+'\')">×</button>':'');
  }catch(err){
    if(box) box.innerHTML='<div class="loading">写真を読み込めませんでした</div>';
  }
}
function removeLocalPhoto(i){
  const e=entryById(currentEntryId); if(!e) return;
  const arr=LocalPhotos[e.id]||[]; arr.splice(i,1);
  if(arr.length) LocalPhotos[e.id]=arr; else delete LocalPhotos[e.id];
  saveLocalPhotos(); e.updatedAt=Date.now(); saveDB(); renderEntryPhotos(); scheduleSync();
}
function removeDrivePhoto(fid){
  const e=entryById(currentEntryId); if(!e) return;
  e.photoFileIds=(e.photoFileIds||[]).filter(x=>x!==fid);
  e.updatedAt=Date.now(); saveDB(); renderEntryPhotos(); scheduleSync();
}
function onPhotoFile(input){
  const file=input.files && input.files[0]; input.value='';
  const e=entryById(currentEntryId); if(!file || !e) return;
  processPhotoFile(file).then((dataUrl)=>{
    if(!LocalPhotos[e.id]) LocalPhotos[e.id]=[];
    LocalPhotos[e.id].push(dataUrl); saveLocalPhotos();
    e.updatedAt=Date.now(); saveDB(); renderEntryPhotos(); scheduleSync();
  }).catch(()=>{ sheetInfo('写真', '写真を読み込めませんでした。'); });
}
function processPhotoFile(file){
  return new Promise((resolve, reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        const max=1600; let w=img.naturalWidth, h=img.naturalHeight;
        const scale=Math.min(1, max/Math.max(w,h)); w=Math.round(w*scale); h=Math.round(h*scale);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL('image/jpeg', 0.82));
      }catch(err){ reject(err); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src=url;
  });
}

/* ================= Google Drive sync ================= */
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
const DRIVE_API='https://www.googleapis.com/drive/v3';
const UPLOAD_API='https://www.googleapis.com/upload/drive/v3';
let syncStatus='disconnected'; /* disconnected | syncing | synced | error */
let syncMsg='';
let lastSyncAt=0;
let syncTimer=null;
let syncRunning=false;

const DEFAULT_CLIENT_ID='386087008053-de53ufnkvcnbjslkuhmq2l2pm9fj4c2t.apps.googleusercontent.com';
function getClientId(){ return (storeGet(LS_CID)||'').trim() || DEFAULT_CLIENT_ID; }
function getValidToken(){
  const tok=storeGet(SS_TOKEN);
  const exp=+(storeGet(LS_TOKEN_EXP)||0);
  if(tok && exp && Date.now()<exp-15000) return tok;
  return null;
}
function isDriveConnected(){ return !!getValidToken(); }
function storeToken(tok, expiresInSec){
  storeSet(SS_TOKEN, tok);
  storeSet(LS_TOKEN_EXP, String(Date.now() + (expiresInSec||3600)*1000));
  storeDel(LS_AUTH_ERR);
}
function clearToken(){
  storeDel(SS_TOKEN);
  storeDel(LS_TOKEN_EXP);
  storeDel(LS_AUTH_ERR);
}
function setSyncStatus(st, msg){
  syncStatus=st; if(typeof msg==='string') syncMsg=msg;
  renderSyncStatus();
}
function renderSyncStatus(){
  let label, cls='';
  if(syncStatus==='synced') label='同期済み'+(lastSyncAt ? '（'+pad2(new Date(lastSyncAt).getHours())+':'+pad2(new Date(lastSyncAt).getMinutes())+'）' : '');
  else if(syncStatus==='syncing') label='同期中…';
  else if(syncStatus==='error'){ label='同期エラー'+(syncMsg ? '：'+syncMsg : ''); cls='err'; }
  else label='Drive未接続（端末内に保存中）';
  const bar=$('syncbar'); if(bar) bar.innerHTML='<span class="'+cls+'">'+esc(label)+'</span>';
  const st=$('syncstat'); if(st) st.innerHTML='<span class="'+cls+'">'+esc(label)+'</span>';
}
function scheduleSync(){
  if(!isDriveConnected()) return;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{ syncNow('auto'); }, 1500);
}
function redirectUri(){ return location.origin + location.pathname; }

function connectDrive(){
  const cid=getClientId();
  if(!cid){ sheetInfo('Drive接続', '先に OAuth クライアントID を入力してください。'); return; }
  storeSet(LS_CID, cid);
  if(!(window.google && google.accounts && google.accounts.oauth2)){
    sheetInfo('Drive接続', 'Googleのライブラリを読み込めませんでした。通信環境を確認して、もう一度お試しください。'); return;
  }
  try{
    const tc=google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: DRIVE_SCOPE,
      ux_mode: 'popup',
      callback: function(resp){
        if(resp && resp.access_token){
          storeToken(resp.access_token, parseInt(resp.expires_in||'3600',10));
          storeDel(LS_PENDING);
          setSyncStatus('syncing');
          syncNow('connect');
        } else {
          setSyncStatus('error', 'トークンを取得できませんでした');
        }
      },
      error_callback: function(err){
        const t='認証エラー：'+((err && (err.type || err.message)) || 'unknown');
        storeSet(LS_AUTH_ERR, t);
        setSyncStatus('error', t);
        storeDel(LS_PENDING);
      }
    });
    storeSet(LS_PENDING, String(Date.now()));
    tc.requestAccessToken();
  }catch(e){
    sheetInfo('Drive接続', '接続を開始できませんでした：'+(e && e.message ? e.message : e));
  }
}
function disconnectDrive(){
  const tok=getValidToken();
  if(tok && window.google && google.accounts && google.accounts.oauth2){
    try{ google.accounts.oauth2.revoke(tok, function(){}); }catch(e){}
  }
  clearToken(); setSyncStatus('disconnected');
}
function checkAuthRedirect(){
  let handled=null;
  const hadPending=!!storeGet(LS_PENDING);
  if(location.hash && location.hash.indexOf('access_token')>=0){
    const p=new URLSearchParams(location.hash.slice(1));
    const tok=p.get('access_token');
    const exp=parseInt(p.get('expires_in')||'3600', 10);
    if(tok){ storeToken(tok, exp); storeDel(LS_PENDING); handled='token'; }
    try{ history.replaceState(null, '', location.pathname+location.search); }catch(e){}
  } else if(location.hash && location.hash.indexOf('error')>=0){
    const p=new URLSearchParams(location.hash.slice(1));
    const errTxt='認証エラー：'+(p.get('error')||'unknown')+((p.get('error_description')) ? '（'+p.get('error_description')+'）' : '');
    storeSet(LS_AUTH_ERR, errTxt);
    setSyncStatus('error', errTxt);
    storeDel(LS_PENDING);
    handled='error';
    try{ history.replaceState(null, '', location.pathname+location.search); }catch(e){}
  } else if(location.hash && location.hash.length>1){
    const noteTxt='認証の戻り（トークンなし）：'+location.hash.slice(0,120);
    storeSet(LS_AUTH_ERR, noteTxt);
    setSyncStatus('error', noteTxt);
    storeDel(LS_PENDING);
    handled='error';
    try{ history.replaceState(null, '', location.pathname+location.search); }catch(e){}
  }
  if(!handled && hadPending && !isDriveConnected()){

  const m=/^data:([^;,]+)?(;base64)?,(.*)$/.exec(dataUrl||'');

  if(m[2]){ const bin=atob(m[3]); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr], { type:m[1]||'image/jpeg' }); }

}
async function uploadPendingPhotos(){
  const tok=getValidToken(); if(!tok) return;
  for(const entryId of Object.keys(LocalPhotos)){
    const e=entryById(entryId); if(!e) continue;
    const arr=LocalPhotos[entryId]||[];
    const remaining=[];
    for(let i=0;i<arr.length;i++){
      try{
        const name='photo_'+entryId+'_'+((e.photoFileIds||[]).length+ (arr.length-remaining.length)) +'.jpg';
        const meta={ name:name, mimeType:'image/jpeg' };
        const form=new FormData();

        form.append('file', dataURLtoBlob(arr[i]), name);
        const res=await fetch(UPLOAD_API+'/files?uploadType=multipart&fields=id', { method:'POST', headers:{ Authorization:'Bearer '+tok }, body: form });
        if(!res.ok) throw new Error('photo upload HTTP '+res.status);

}

async function syncNow(reason){
  if(syncRunning) return;
  const tok=getValidToken();
  if(!tok){ setSyncStatus(getClientId() ? 'disconnected' : 'disconnected', ''); return; }
  syncRunning=true; setSyncStatus('syncing');
  try{
    await uploadPendingPhotos();
    let file=await findDiaryFile();
    if(!file){
      await createDiary(DB);
    } else {
      let remote=await downloadDiary(file.id);
      let merged=mergeData(DB, remote);
      const rev=await getHeadRevision(file.id);
      if(rev && file.headRevisionId && rev!==file.headRevisionId){
        remote=await downloadDiary(file.id);
        merged=mergeData(DB, remote);
      }
      DB=merged; saveDB(); applyAppearance();
      await uploadDiaryUpdate(file.id, DB);
    }
    await syncTodo();
    lastSyncAt=Date.now();
    setSyncStatus('synced');
    if(currentView==='list') renderList();
    if(currentView==='calendar') renderCalendar();
    if(currentView==='entry') renderEntry();
    if(currentView==='settings') renderSyncStatus();
  }catch(e){
    setSyncStatus('error', (e && e.message) ? e.message : String(e));
  }finally{
    syncRunning=false;
  }
}

    if (!TodoDB) return;

    const tok = getValidToken(); if (!tok) return;

      form.append('file', new Blob([JSON.stringify(TodoDB)], { type: 'application/json' }), 'todo.json');
      await fetch(UPLOAD_API + '/files?uploadType=multipart&fields=id', { method: 'POST', headers: { Authorization: 'Bearer ' + tok }, body: form });

    if (!dl.ok) return;
    const remote = normalizeTodo(JSON.parse(await dl.text()));
    if (remote && (remote.updatedAt || 0) > (TodoDB.updatedAt || 0)) {
      TodoDB = remote; saveTodoLocal();
      if (currentView === 'todo') renderTodo();
    } else if ((TodoDB.updatedAt || 0) > (remote ? (remote.updatedAt || 0) : 0)) {
      await fetch(UPLOAD_API + '/files/' + encodeURIComponent(file.id) + '?uploadType=media', { method: 'PATCH', headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' }, body: JSON.stringify(TodoDB) });

      + '<span class="tdhandle">☰</span></div>';
  }).join('');
  tdModalOpen(tmHead(f.name + ' のリスト', 'renderAdminRoot()') + '<p class="tmnote">項目をタップすると名前を編集できます</p><div class="tmcard" data-dragkind="lists">' + (rows || '<div class="tmrow">リストがありません</div>') + '</div>');
}
let admRn = null;
function adminRename(kind, id) {
  const obj = kind === 'list' ? listById(id) : folderById(id); if (!obj) return;
  admRn = { kind: kind, id: id };
  const back = kind === 'list' ? 'renderAdminLists()' : 'renderAdminRoot()';
  tdModalOpen(tmHead(kind === 'list' ? 'リスト名編集' : 'フォルダ名編集', back)
    + '<input id="admname" class="tdfinput" value="' + escA(obj.name) + '">'
    + '<button class="sheetbtn primary" style="margin-top:16px" onclick="adminRenameSave()">保存</button>');
  const inp = $('admname'); setTimeout(function () { if (inp) { inp.focus(); inp.select(); } }, 80);
}
function adminRenameSave() {
  const nm = $('admname').value.trim(); if (!nm) return;
  const obj = admRn.kind === 'list' ? listById(admRn.id) : folderById(admRn.id);
  if (obj) obj.name = nm;
  touchTodo(); renderTodo();
  if (admRn.kind === 'list') renderAdminLists(); else renderAdminRoot();
}
function adminDelFolder(id) {
  const f = folderById(id); if (!f) return;
  tdConfirm('フォルダを削除', '「' + f.name + '」の中のリストとToDoをすべてゴミ箱に移動しますか？', '削除する', function () {
    doDeleteFolderSilent(id); renderAdminRoot(); renderTodo();
  });
}
function adminDelList(id) {
  const l = listById(id); if (!l) return;
  tdConfirm('リストを削除', '「' + l.name + '」の中のToDoをすべてゴミ箱に移動しますか？', '削除する', function () {
    moveToTrash(todosInList(id));
    TodoDB.todos = TodoDB.todos.filter(function (t) { return t.listId !== id; });
    TodoDB.lists = TodoDB.lists.filter(function (x) { return x.id !== id; });
    if (todoListId === id) todoListId = null;
    touchTodo(); renderAdminLists(); renderTodo();
  });
}
function doDeleteFolderSilent(id) {
  moveToTrash(folderAllTodos(id));
  const listIds = new Set(listsInFolder(id).map(function (l) { return l.id; }));
  TodoDB.todos = TodoDB.todos.filter(function (t) { return t.folderId !== id && !listIds.has(t.listId); });
  TodoDB.lists = TodoDB.lists.filter(function (l) { return l.folderId !== id; });
  TodoDB.folders = TodoDB.folders.filter(function (f) { return f.id !== id; });
  if (todoFolderId === id) todoFolderId = TodoDB.folders.length ? TodoDB.folders[0].id : null;
  todoListId = null; touchTodo();
}
/* ---- swipe back ---- */
let tdSwipe = null;
document.addEventListener('touchstart', function (e) {
  if (!todoListId && !todoSpecial) { tdSwipe = null; return; }
  const t = e.changedTouches[0]; tdSwipe = { x: t.clientX, y: t.clientY };
}, { passive: true });
document.addEventListener('touchend', function (e) {
  if (!tdSwipe) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - tdSwipe.x, dy = t.clientY - tdSwipe.y;
  tdSwipe = null;
  if (dx < 72 || Math.abs(dy) > 42) return;
  if ($('tdoverlay').classList.contains('open') || $('tddrawer').classList.contains('open') || $('tdmodal').classList.contains('open')) return;
  if (todoSpecial) closeSpecial(); else if (todoListId) closeTodoList();
}, { passive: true });
/* ---- drag reorder (pointer events, delegated) ---- */
let dragCtx = null;
document.addEventListener('pointerdown', function (e) {
  const h = e.target.closest ? e.target.closest('.tdhandle') : null; if (!h) return;
  const row = h.closest('[data-dragid]'); if (!row || !row.parentElement) return;
  const rows = Array.prototype.slice.call(row.parentElement.querySelectorAll('[data-dragid]'));
  dragCtx = { row: row, rows: rows, idx: rows.indexOf(row), newIdx: rows.indexOf(row), y0: e.clientY, hh: Math.max(30, row.offsetHeight), kind: row.parentElement.getAttribute('data-dragkind') };
  row.classList.add('dragging');
  try { row.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});
document.addEventListener('pointermove', function (e) {
  if (!dragCtx) return;
  const dy = e.clientY - dragCtx.y0;
  const shift = Math.max(-dragCtx.idx, Math.min(dragCtx.rows.length - 1 - dragCtx.idx, Math.round(dy / dragCtx.hh)));
  dragCtx.newIdx = dragCtx.idx + shift;
  dragCtx.row.style.transform = 'translateY(' + dy + 'px)';
  dragCtx.rows.forEach(function (r, i) {
    if (r === dragCtx.row) return;
    let t = 0;
    if (dragCtx.idx < i && i <= dragCtx.newIdx) t = -dragCtx.hh;
    else if (dragCtx.newIdx <= i && i < dragCtx.idx) t = dragCtx.hh;
    r.style.transform = t ? 'translateY(' + t + 'px)' : '';
  });
});
document.addEventListener('pointerup', function () {
  if (!dragCtx) return;
  const ctx = dragCtx; dragCtx = null;
  ctx.rows.forEach(function (r) { r.style.transform = ''; r.classList.remove('dragging'); });
  if (ctx.newIdx === ctx.idx) return;
  const ids = ctx.rows.map(function (r) { return +r.getAttribute('data-dragid'); });
  const moved = ids.splice(ctx.idx, 1)[0]; ids.splice(ctx.newIdx, 0, moved);
  if (ctx.kind === 'todos') {
    const c = curContainer(); if (!c) return;
    const map = {}; c.items.forEach(function (t) { map[t.id] = t; });
    reorderGlobal(ids.map(function (id) { return map[id]; }).filter(Boolean));
    c.obj.sort = 'custom'; touchTodo(); renderTodo();
  } else if (ctx.kind === 'folders') {
    TodoDB.folders = ids.map(function (id) { return folderById(id); }).filter(Boolean);
    touchTodo(); if ($('tdmodal').classList.contains('open')) renderAdminRoot(); renderTodo();
  } else if (ctx.kind === 'lists') {
    const mine = listsInFolder(adminListFolder);
    const map = {}; mine.forEach(function (l) { map[l.id] = l; });
    const sorted = ids.map(function (id) { return map[id]; }).filter(Boolean);
    const idSet = new Set(mine.map(function (l) { return l.id; })); let i = 0;
    TodoDB.lists = TodoDB.lists.map(function (l) { return idSet.has(l.id) ? sorted[i++] : l; });
    touchTodo(); renderAdminLists(); renderTodo();
  }
});

/* ================= init ================= */
(function init(){
  const sp=$('splash');
  if(sp){
    const hideSplash=()=>{ if(!sp.classList.contains('hide')){ sp.classList.add('hide'); setTimeout(()=>{ try{ sp.remove(); }catch(e){} }, 260); } };
    sp.addEventListener('click', hideSplash);
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) hideSplash();
    setTimeout(splashGo, 1500); /* 保険：更新確認が終わらなくても開始する */
    setTimeout(hideSplash, 2800); /* 保険：何があっても必ず消す */
  }
  applyAppearance();
  loadTodo(); renderTodo();
  const authResult=checkAuthRedirect();
  renderList(); renderCalendar(); renderSyncStatus();
  if(authResult==='token'){
    setSyncStatus('syncing');
    setTimeout(()=>syncNow('connect'), 300);
  } else if(authResult==='error'){
    /* 認証エラーを表示したままにする（サイレント更新で上書きしない） */
  } else if(isDriveConnected()){
    setTimeout(()=>syncNow('startup'), 300);
  } else if(getClientId() && storeGet(LS_AUTH_ERR)){
    setSyncStatus('error', storeGet(LS_AUTH_ERR));
  } else if(getClientId()){
    setTimeout(trySilentRefresh, 800);
  }
  checkForUpdate();
  requestAnimationFrame(()=>moveNavInd(false));
})();
</script>
